<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" type="image/png" href="/static/images/pait-star-ring-icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>注册 · 派特岛</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="/static/css/auth-island.css?v={{ app_version }}">
</head>
<body class="theme auth-island">
    <div class="auth-landscape" aria-hidden="true"></div><div class="auth-mist" aria-hidden="true"></div>
    <header class="auth-top"><a class="auth-brand" href="/"><img src="/static/images/pait-star-ring-icon.png" alt="">派特岛</a><a class="auth-back" href="/">探索云端群岛 ↗</a></header>
    <main class="auth-layout"><section class="auth-story"><span class="auth-eyebrow">PAIT ISLAND · 心有栖所</span><h1>越过云海，<br>有人等你回来。</h1><p>把世界的喧嚣留在远方。<br>在这座小岛，与你的伙伴慢慢相识。</p><div class="auth-orbit"></div><p class="auth-caption">月光 · 云海 · 一份温柔的陪伴</p></section>
    <div class="auth-card">
        <h2>让相遇，从这里开始</h2>
        <p class="auth-subtitle">创建账号，让一只有性格、有记忆的小伙伴开始陪伴你。</p>
        <form method="post" action="" id="reg-form" novalidate>
            <div class="form-tip" role="alert">{{ error or '' }}</div>
            <div class="field">
                <label for="username">昵称（2–20 个字符）</label>
                <input class="input" type="text" id="username" name="username" size="30" maxlength="20" placeholder="给自己起个名字"
                       value="{{ request.form.username }}" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="password">密码（至少 6 位）</label>
                <input class="input" type="password" id="password" name="password" size="30" minlength="6" placeholder="至少 6 位" autocomplete="new-password" required>
            </div>
            <div class="field">
                <label for="password2">确认密码</label>
                <input class="input" type="password" id="password2" name="password2" size="30" minlength="6" placeholder="再输一次"
                       autocomplete="new-password" required>
            </div>
            <button class="btn" type="submit" style="width: 100%;">注册</button>
        </form>
        <div class="login-links">
            <a href="{{ url_for('main.index') }}">← 返回首页</a>
            <a href="{{ url_for('auth.reader_login') }}">已有账号，去登录</a>
        </div>
    </div>
    </main>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>

    <script>
    // 即时校验；注册是否成功以服务端结果为准。
    document.getElementById('reg-form').addEventListener('submit', function (e) {
        var u = document.getElementById('username').value.trim();
        var p1 = document.getElementById('password').value;
        var p2 = document.getElementById('password2').value;
        function fail(msg) {
            e.preventDefault();
            var tip = document.querySelector('.form-tip');
            tip.textContent = msg;
            toast(msg, 'error');
        }
        if (u.length < 2) return fail('昵称至少 2 个字符');
        if (!/^[\u4e00-\u9fa5A-Za-z0-9_]+$/.test(u)) return fail('昵称只能包含中文、英文、数字、下划线');
        if (p1.length < 6) return fail('密码至少 6 位');
        if (p1 !== p2) return fail('两次输入的密码不一致');

    });
    </script>
</body>
</html>
