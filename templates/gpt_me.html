<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" type="image/png" href="/static/images/pait-app-icon-f4.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>和宠物聊天 · 派特岛</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <style>
        /* ===== 聊天页专属样式（布局规范：设计文档 三.1） ===== */
        html, body { height: 100%; }
        body {
            margin: 0;
            font-family: var(--font-body);
            color: var(--c-text);
            background: var(--c-bg) no-repeat center / cover; /* 背景图由 JS 按宠物切换 */
            transition: background-image .4s ease;
            display: flex;
            flex-direction: column;
        }

        /* 聊天顶栏（与全站 _navbar 同款式变体） */
        .chat-nav {
            height: var(--nav-h);
            flex: none;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 16px;
            background: rgba(255, 248, 240, .92);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--c-line);
        }
        .chat-nav .brand {
            display: flex; align-items: center; gap: 8px;
            font-family: var(--font-round); font-size: 17px; font-weight: bold;
            color: var(--c-text); text-decoration: none;
        }
        .chat-nav .brand img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; }
        .chat-nav .current-pet {
            font-size: 15px; color: var(--c-primary-deep); font-weight: 600;
            padding: 4px 12px; background: var(--c-bubble-user); border-radius: 999px;
        }
        .chat-nav .spacer { flex: 1; }
        .icon-btn {
            width: auto; min-width: 36px; height: 36px;
            display: inline-flex; align-items: center; justify-content: center;
            gap: 4px; padding: 0 8px;
            border: none; background: transparent; border-radius: 999px;
            font-size: 15px; cursor: pointer; color: var(--c-text-sub);
            transition: background .12s ease;
        }
        .icon-btn .btn-label { font-size: 12px; }
        .icon-btn:hover { background: rgba(74,59,50,.08); color: var(--c-text); }

        /* 宠物选择条（内容与下方消息卡片同宽对齐） */
        .pet-strip {
            flex: none;
            width: 100%;
            max-width: 892px;  /* 860 卡片 + 16*2 边距 */
            align-self: center;
            display: flex;
            gap: 16px;
            align-items: center;
            padding: 12px 16px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .pet-strip::-webkit-scrollbar { display: none; }
        .pet-tile {
            flex: none;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            background: none; border: none; cursor: pointer; padding: 0;
        }
        .pet-tile img {
            width: 48px; height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid transparent;
            background: #fff;
            transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
        }
        .pet-tile:hover img { transform: scale(1.08); }
        .pet-tile.selected img {
            border-color: var(--c-primary);
            box-shadow: 0 0 0 4px rgba(255, 158, 88, .35);
        }
        .pet-tile .pet-name {
            font-size: 12px; color: var(--c-text-sub); line-height: 1.2;
            white-space: nowrap;
        }
        .pet-tile.selected .pet-name { color: var(--c-primary-deep); font-weight: 700; }
        .pet-tile.upload-tile img {
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; color: var(--c-text-sub);
            border: 2px dashed var(--c-line);
        }

        /* 消息区 */
        .chat-main {
            flex: 1;
            min-height: 0;
            display: flex;
            justify-content: center;
            padding: 0 16px 8px;
        }
        .chat-window {
            width: 100%;
            max-width: 860px;
            background: var(--c-card);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }
        .chat-messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 16px 16px 28px;   /* 底部留足，末条消息不被裁切 */
            scroll-behavior: smooth;
        }
        .msg-row {
            display: flex;
            margin-bottom: 12px;
            align-items: flex-start;
            gap: 8px;
        }
        .msg-row.user { justify-content: flex-end; }
        .msg-row .avatar {
            width: 36px; height: 36px; flex: none;
            border-radius: 50%; object-fit: cover;
            background: #fff;
            box-shadow: var(--shadow);
        }
        .msg-bubble-wrap { display: flex; flex-direction: column; max-width: 72%; }
        .msg-bubble {
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.6;
            word-break: break-word;
            white-space: normal;
        }
        .msg-row.pet .msg-bubble { background: var(--c-bubble-pet); border-top-left-radius: 4px; box-shadow: var(--shadow); }
        .msg-row.user .msg-bubble { background: var(--c-bubble-user); border-top-right-radius: 4px; }
        .msg-bubble p { margin: 0 0 8px; } .msg-bubble p:last-child { margin: 0; }
        .msg-bubble pre { background: #F6EFE7; padding: 8px; border-radius: 8px; overflow-x: auto; }
        .msg-time { font-size: 12px; color: var(--c-text-sub); margin-top: 2px; font-weight: 500; }
        .msg-row.user .msg-time { text-align: right; }
        /* 消息快捷操作（S1-03）：桌面 hover 显示，触屏常显 */
        .msg-actions {
            display: flex;
            gap: 4px;
            margin-top: 4px;
            opacity: 0;
            transform: translateY(-2px);
            transition: opacity .15s ease, transform .15s ease;
        }
        .msg-row.user .msg-actions { justify-content: flex-end; }
        .msg-row:hover .msg-actions,
        .msg-row:focus-within .msg-actions {
            opacity: 1;
            transform: translateY(0);
        }
        .msg-action {
            min-height: 28px;
            padding: 3px 8px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: var(--c-text-sub);
            cursor: pointer;
            font: inherit;
            font-size: 12px;
        }
        .msg-action:hover {
            background: rgba(74, 59, 50, .08);
            color: var(--c-text);
        }
        .msg-action:disabled { opacity: .55; cursor: default; }
        @media (max-width: 767px), (hover: none) {
            .msg-actions { opacity: 1; transform: none; }
        }
        .msg-error .msg-bubble { background: var(--c-danger-bg); color: var(--c-danger); font-size: 14px; }
        .msg-error .retry-btn {
            margin-top: 6px; height: 28px; padding: 0 12px; font-size: 12px;
        }
        .msg-divider {
            text-align: center; font-size: 12px; color: var(--c-text-sub);
            margin: 8px 0 12px;
        }
        .typing-row { display: flex; gap: 6px; align-items: center; color: var(--c-text-sub); font-size: 13px; padding: 4px 8px; }
        .typing-dots { display: inline-flex; gap: 4px; }
        .typing-dots i {
            width: 6px; height: 6px; border-radius: 50%; background: var(--c-primary);
            animation: bounce 1.2s infinite;
        }
        .typing-dots i:nth-child(2) { animation-delay: .15s; }
        .typing-dots i:nth-child(3) { animation-delay: .3s; }
        @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-4px); } }
        @media (prefers-reduced-motion: reduce) {
            .typing-dots i { animation: none; }
        }

        /* 输入区 */
        .chat-input-bar {
            flex: none;
            display: flex;
            gap: 12px;
            align-items: flex-end;
            padding: 12px 16px 16px;
            padding-bottom: calc(16px + env(safe-area-inset-bottom));
        }
        .chat-input {
            flex: 1;
            min-height: 40px;
            max-height: 88px;      /* 约 3 行，之后内部滚动 */
            overflow-y: auto;
            padding: 8px 14px;
            border: 1px solid var(--c-line);
            border-radius: var(--radius-input);
            background: #fff;
            font-family: var(--font-body);
            font-size: 15px;
            color: var(--c-text);
            line-height: 1.5;
            resize: none;
        }
        .chat-input:focus {
            outline: none;
            border-color: var(--c-primary);
            box-shadow: 0 0 0 3px rgba(255, 158, 88, .2);
        }
        .send-btn { width: 88px; flex: none; min-height: 44px; }
        .ver-chip { flex: none; align-self: center; background: linear-gradient(135deg,#f59e0b,#f97316);
            color: #fff; font-weight: 800; font-size: 13px; letter-spacing: .5px;
            padding: 4px 12px; border-radius: 999px; box-shadow: 0 2px 8px rgba(245,158,11,.4); }
        .voice-btn { flex: none; min-height: 44px; padding: 0 14px; border-radius: 12px;
            display: inline-flex; align-items: center; gap: 6px; font-size: 15px; }
        .voice-btn.on { background: #f59e0b; border-color: #f59e0b; color: #fff;
            animation: voice-pulse 1.6s infinite; }
        @keyframes voice-pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(245,158,11,.45); }
            50% { box-shadow: 0 0 0 8px rgba(245,158,11,0); } }
        .voice-btn .v-label { font-size: 13px; }
        .pet-strip::-webkit-scrollbar { display: none; }   /* S1-12：选宠条横滑不显滚动条 */

        .disclaimer {
            flex: none; text-align: center;
            font-size: 12px; color: var(--c-text-sub);
            padding: 0 16px calc(8px + env(safe-area-inset-bottom));
        }

        /* 响应式（设计文档 三.1） */
        @media (max-width: 1023px) {
            .pet-tile img { width: 44px; height: 44px; }
            .chat-nav .current-pet { display: none; }
        }
        @media (max-width: 767px) {
            .chat-nav .brand span { display: none; }
            .msg-bubble-wrap { max-width: 85%; }
            .send-btn { width: 64px; }
            .pet-strip { padding: 8px 12px; }
        }
    </style>
<link rel="stylesheet" href="{{ url_for('static', filename='css/ui-polish.css') }}?v={{ app_version }}">

</head>
<body>
    <!-- 聊天顶栏（同 _navbar 款式变体：logo 可点回首页） -->
    <header class="chat-nav">
        <a class="brand" href="/" aria-label="返回首页">
            <img src="{{ url_for('static', filename='images/pait-app-icon-f4.png') }}" alt="">
            <span>派特岛</span>
        </a>
        <span class="current-pet" id="current-pet-name">小家伙</span>
        <button type="button" id="btn-pet-profile" class="btn-link" style="border:0;background:transparent;color:#A89484;font:inherit;font-size:12px;cursor:pointer;padding:4px 6px;text-decoration:underline;">资料</button>
        <div class="spacer"></div>
        <button class="icon-btn" id="btn-diary" aria-label="我的日记" title="我的日记">📖<span class="btn-label">日记</span></button>
        <span class="ver-chip" title="派特岛 v{{ app_version }}，更新日志见仓库 CHANGELOG.md">v{{ app_version }}</span>
        <button class="icon-btn" id="btn-feedback" aria-label="宠物反馈" title="宠物反馈">⭐<span class="btn-label">反馈</span></button>
        <button class="icon-btn" id="btn-pdf" aria-label="导出聊天记录 PDF" title="导出 PDF">📄<span class="btn-label">PDF</span></button>
        <button class="icon-btn" id="btn-settings" aria-label="设置" title="设置">⚙️<span class="btn-label">设置</span></button>
    </header>

    <!-- 宠物选择条 -->
    <div class="pet-strip" id="pet-strip" role="tablist" aria-label="选择聊天宠物"></div>

    <!-- 消息区 -->
    <main class="chat-main">
        <div class="chat-window">
            <div class="chat-messages" id="chat-messages" aria-live="polite"></div>
            <div class="chat-input-bar">
                <textarea class="chat-input" id="chat-input" rows="1"
                          placeholder="和它说说今天…" title="Enter 发送，Shift+Enter 换行"
                          aria-label="消息输入框"></textarea>
                <button class="btn voice-btn" id="voice-btn" title="实时语音对话"
                        aria-label="开启实时语音对话">🎤<span class="v-label">实时语音</span></button>
                <button class="btn send-btn" id="send-btn">发送</button>
            </div>
        </div>
    </main>
    <div class="disclaimer">平台服务不能替代专业的医疗诊断、治疗或危机干预。</div>

    <!-- 设置弹层（规范：设计文档 三.1） -->
    <div class="modal-mask" id="settings-mask" hidden>
        <div class="modal" role="dialog" aria-label="聊天设置">
            <h3>⚙️ 聊天设置</h3>
            <div class="field">
                <label for="pref-nickname">你的昵称</label>
                <input class="input" id="pref-nickname" maxlength="20" placeholder="怎么称呼你">
            </div>
            <div class="field">
                <label for="pref-petname">宠物昵称</label>
                <input class="input" id="pref-petname" maxlength="20" placeholder="给宠物起个名字">
            </div>
            <div class="field">
                <label for="pref-model">对话模型</label>
                <select class="input" id="pref-model"></select>
            </div>
            <hr style="border: none; border-top: 1px solid var(--c-line); margin: 16px 0;">
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button class="btn-outline btn-sm" id="btn-reset-avatar">恢复默认头像</button>
                <button class="btn-danger btn-sm" id="btn-clear-history">清空聊天记录</button>
                <button class="btn" id="btn-save-settings">保存并关闭</button>
            </div>
        </div>
    </div>

    <input type="file" id="upload-input" accept="image/png,image/jpeg,image/webp" hidden>

    <!-- 本地依赖（设计文档 第五节：CDN 全部本地化） -->
    <script src="{{ url_for('static', filename='js/vendor/marked.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/vendor/html2canvas.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/vendor/jspdf.umd.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/share-card.js') }}"></script>
    <script>window.COMPANION_SCOPE={{ companion_scope | tojson }};</script>

    <script src="{{ url_for('static', filename='js/realtime/pcm-player.js') }}?v={{ app_version }}"></script>
    <script src="{{ url_for('static', filename='js/realtime/realtime-client.js') }}?v={{ app_version }}"></script>
<script src="/static/js/realtime/speaker-gate.js?v={{ app_version }}"></script>
<script src="/static/js/realtime/voiceprint-ui.js?v={{ app_version }}"></script>
    <script src="{{ url_for('static', filename='js/realtime/realtime-controller.js') }}?v={{ app_version }}"></script>
    <script src="{{ url_for('static', filename='js/realtime/realtime-ui.js') }}?v={{ app_version }}"></script>
    <script src="{{ url_for('static', filename='js/pet-sounds.js') }}?v={{ app_version }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script>
    /* ===== 聊天页逻辑（规范：docs/UI重构设计文档.md 三.1） ===== */
    (function () {
        'use strict';

        // ---------- 后端注入数据 ----------
        const PETS = {{ pets | tojson }};
        const MODELS = {{ models | tojson }};
        const INIT_PET = {{ initial_pet }};
        const MODEL_NAMES = { 'glm-4.5-flash': '标准（推荐）' };  // 模型友好名映射

        // ---------- 常量 ----------
        const HISTORY_KEY = 'chatHistory:' + window.COMPANION_SCOPE;      // 沿用旧 key，日记页同源读取
        const AVATAR_KEY = 'customAvatar:' + window.COMPANION_SCOPE;
        const PREFS_KEY = 'userPrefs:' + window.COMPANION_SCOPE;
        const HISTORY_CAP = 50;
        const GREETINGS = {
            1: '汪！我是球球，一只超活泼的柴犬！今天想和我聊点什么呀？',
            2: '嗷呜~我是雪球，帅气的哈士奇！来陪我聊聊天吧，想聊什么都可以哦！',
            3: '喵~我是团子，一只傲娇又黏人的小猫咪。呼噜呼噜…你想陪我玩吗？',
            4: '汪！我是大壮，你最忠诚的德牧伙伴！有什么想说的都可以告诉我！',
        };
        // 情绪化等待文案：按宠物人格轮换（1.8s 一换，禁用技术词，不承诺疗效）
        const TYPING_LINES = {
            1: ['正在摇摇尾巴…', '正在认真听你说…', '正在用爪爪想办法…'],
            2: ['正在歪头思考…', '正在小声嗷呜…', '正在兴奋地转圈…'],
            3: ['正在轻轻踩奶…', '正在眯着眼想你…', '正在呼噜呼噜思考…'],
            4: ['正在认真守护你…', '正在竖起耳朵倾听…', '正在想怎么陪你…'],
        };

        // ---------- DOM ----------
        const $ = (id) => document.getElementById(id);
        const messagesEl = $('chat-messages');
        const inputEl = $('chat-input');
        const sendBtn = $('send-btn');
        const stripEl = $('pet-strip');
        const currentPetNameEl = $('current-pet-name');
        const uploadInput = $('upload-input');

        // ---------- 实时语音（P0）：面板与状态机见 static/js/realtime/ ----------
        const rtUI = new RealtimeUI({
            surface:'chat',
            onState(state){
                const active=!['ERROR','STOPPED','IDLE'].includes(state);
                $('voice-btn').classList.toggle('on',active);
                $('voice-btn').setAttribute('aria-pressed',String(active));
                if(active)stopSpeaking();
            },
            onError:e=>toast(e.message||'语音暂不可用','info'),
            getPet: () => currentPet(),
            getGender: () => (window.PetProfile ? PetProfile.promptValue(PetProfile.get(currentPet().id).gender) : null),
            // 一轮语音对话完整结束才落历史：一条用户消息 + 一条宠物消息（与 doSend 同结构）
            onRound: (userText, aiText, pet) => {
                if (userText) {
                    const uRow = { role: 'user', sender: prefs.nickname || '我',
                        message: userText, petId: pet.id, ...messageTimeFields() };
                    history.push(uRow);
                    appendHtml(bubbleHtml(uRow));
                }
                if (aiText) {
                    const aRow = { role: 'assistant', sender: pet.name,
                        message: aiText, petId: pet.id, ...messageTimeFields() };
                    history.push(aRow);
                    appendHtml(bubbleHtml(aRow));
                }
                if (userText || aiText) saveHistory();

            },
        });
        if(window.BroadcastChannel){const memoryChannel=new BroadcastChannel('companion-memory:'+window.COMPANION_SCOPE);memoryChannel.onmessage=()=>{if(rtUI.isActive())rtUI.stop();};}
        $('voice-btn').addEventListener('click', () => {
            rtUI.toggle();
            $('voice-btn').classList.toggle('on', rtUI.isActive());
        });
        window.addEventListener('pagehide',()=>rtUI.stop());
        window.__chatVoice=rtUI;

        // ---------- 状态 ----------
        let currentPetIndex = Math.max(0, PETS.findIndex(p => p.id === INIT_PET));
        let useCustomAvatar = false;
        let customAvatarUrl = null;
        let sending = false;
        let retryMessage = null;
        let typingTimer = null;
        let prefs = { nickname: '', petNickname: '', model: MODELS[0] };
        let storageOK = true;

        // ---------- localStorage 安全封装 ----------
        function lsGet(key) {
            try { return localStorage.getItem(key); }
            catch (e) {
                if (storageOK) {
                    storageOK = false;
                    toast('当前浏览器不保存聊天记录', 'info');
                }
                return null;
            }
        }
        function lsSet(key, val) {
            try { localStorage.setItem(key, val); } catch (e) { /* 降级：不持久化 */ }
        }
        function lsRemove(key) {
            try { localStorage.removeItem(key); } catch (e) { /* 忽略 */ }
        }

        function loadHistory() {
            try {
                const raw = lsGet(HISTORY_KEY);
                const arr = raw ? JSON.parse(raw) : [];
                return Array.isArray(arr) ? arr : [];
            } catch (e) { return []; }
        }
        function saveHistory() {
            const arr = history.slice(-HISTORY_CAP);
            lsSet(HISTORY_KEY, JSON.stringify(arr));
        }

        let history = []; // Server-owned history prevents cross-account browser leakage.

        // ---------- 工具 ----------
        function escapeHtml(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }
        function nowTime() {
            const d = new Date();
            return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        }
        // 统一时间字段（S1-05）：ts 兼容旧展示，createdAt 供日记按本地日期分组
        function messageTimeFields() {
            const d = new Date();
            return {
                ts: `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`,
                createdAt: d.toISOString(),
            };
        }
        function currentPet() { return PETS[currentPetIndex] || PETS[0]; }
        // 旧格式历史条目没有 petId：按 sender 名字推断是哪只宠物
        function inferPetId(row) {
            if (row.petId != null) return row.petId;
            const s = String(row.sender || '');
            const hit = PETS.find(p => s.includes(p.name) || (p.role && s.includes(p.role)));
            return hit ? hit.id : null;
        }
        function petDisplayAvatar(petId) {
            if (useCustomAvatar && customAvatarUrl) return customAvatarUrl;
            if (petId == null) return null;   // 无法识别：不显示头像
            const pet = PETS.find(p => p.id === petId);
            return pet ? `/images/${pet.avatar}` : null;
        }

        // ---------- 消息渲染 ----------
        // 本地消息注册表（S1-03）：DOM 只带 data-message-id，正文存 Map，避免把消息拼进 HTML 属性
        const messageRegistry = new Map();
        let messageSeq = 0;
        function ensureMessageId(row) {
            if (!row.localId) {
                messageSeq += 1;
                row.localId = `msg-${Date.now()}-${messageSeq}`;
            }
            messageRegistry.set(row.localId, row);
            return row.localId;
        }

        function bubbleHtml(row) {
            // row: {role:'user'|'assistant', sender, message, petId, ts}
            const isUser = row.role === 'user';
            const rowPetId = inferPetId(row);
            const sender = isUser
                ? (escapeHtml(prefs.nickname || '我'))   // 用户统一显示"我"，不沿用旧记录里的"用户"
                : (escapeHtml(prefs.petNickname || row.sender || (PETS.find(p => p.id === rowPetId) || currentPet()).name || '宠物'));
            let content;
            if (!isUser && window.marked) {
                content = marked.parse(row.message);  // AI 回复渲染 Markdown
            } else {
                content = escapeHtml(row.message).replace(/\n/g, '<br>');
            }
            const avatarSrc = isUser
                ? "{{ url_for('static', filename='images/头像2原图.png') }}"
                : petDisplayAvatar(rowPetId);
            const avatarHtml = avatarSrc ? `<img class="avatar" src="${avatarSrc}" alt="">` : '';
            const meta = [sender, row.ts ? escapeHtml(row.ts) : null].filter(Boolean).join(' · ');
            // 快捷操作栏：正常消息（用户/宠物回复）才有；朗读仅宠物回复
            const localId = ensureMessageId(row);
            const actionsHtml = `
                <div class="msg-actions" data-message-id="${localId}">
                    <button type="button" class="msg-action" data-action="copy" aria-label="复制消息">复制</button>
                    ${isUser ? '' : '<button type="button" class="msg-action" data-action="speak" aria-label="朗读消息">朗读</button>'}
                    <button type="button" class="msg-action" data-action="share" aria-label="分享消息">分享</button>
                </div>`;
            return `
              <div class="msg-row ${isUser ? 'user' : 'pet'}">
                ${isUser ? '' : avatarHtml}
                <div class="msg-bubble-wrap">
                    <div class="msg-bubble">${content}</div>
                    <div class="msg-time">${meta}</div>
                    ${actionsHtml}
                </div>
                ${isUser ? avatarHtml : ''}
              </div>`;
        }

        function appendHtml(html) {
            messagesEl.insertAdjacentHTML('beforeend', html);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function renderDivider(petName) {
            appendHtml(`<div class="msg-divider">—— 现在和 ${escapeHtml(petName)} 聊天 ——</div>`);
        }

        function typingText(pet, index) {
            const lines = TYPING_LINES[pet.id] || ['正在认真听你说…'];
            const line = lines[index % lines.length];
            return `${prefs.petNickname || pet.name}${line}`;
        }

        function showTyping(pet) {
            // 必须传入发起请求时的宠物快照：等待期间切宠物不能让文案串角色
            hideTyping();
            let index = 0;
            appendHtml(`
              <div class="msg-row pet" id="typing-row">
                <img class="avatar" src="${petDisplayAvatar(pet.id)}" alt="">
                <div class="typing-row">
                  <span class="typing-dots"><i></i><i></i><i></i></span>
                  <span id="typing-text">${escapeHtml(typingText(pet, index))}</span>
                </div>
              </div>`);
            typingTimer = window.setInterval(() => {
                index += 1;
                const el = $('typing-text');
                if (el) el.textContent = typingText(pet, index);
            }, 1800);
        }
        function hideTyping() {
            if (typingTimer !== null) {
                window.clearInterval(typingTimer);
                typingTimer = null;
            }
            const el = $('typing-row');
            if (el) el.remove();
        }

        function showErrorBubble(errMsg) {
            hideTyping();
            appendHtml(`
              <div class="msg-row pet" id="error-row">
                <div class="msg-bubble-wrap">
                    <div class="msg-bubble">😟 ${escapeHtml(errMsg)}<br>
                        <button class="btn-outline retry-btn" id="retry-btn">重试</button>
                    </div>
                </div>
              </div>`);
            $('retry-btn').addEventListener('click', () => {
                $('error-row').remove();
                if (retryMessage) { const m = retryMessage; retryMessage = null; doSend(m); }
            });
        }

        // ---------- 消息快捷操作（S1-03） ----------
        // 音频生命周期：同屏只允许一条在播
        let activeAudio = null;
        let activeAudioUrl = null;
        let activePetPlayer = null;   // v1.0.0 PetSounds 序列播放器（朗读真实叫声链）
        let activeSpeakButton = null;
        let speechEpoch=0;
        document.addEventListener('pet-voice-settings-open',()=>stopSpeaking());
        document.addEventListener('pet-voice-changed',()=>stopSpeaking());
        function stopSpeaking() {
            speechEpoch++;
            if (activePetPlayer) { activePetPlayer.stop(); activePetPlayer = null; }
            if (activeAudio) { try { activeAudio.pause(); } catch (e) {} activeAudio = null; }
            if (activeAudioUrl) { URL.revokeObjectURL(activeAudioUrl); activeAudioUrl = null; }
            if (activeSpeakButton) {
                activeSpeakButton.disabled = false;
                activeSpeakButton.textContent = '朗读';
                activeSpeakButton = null;
            }
            if (window.speechSynthesis) { try { speechSynthesis.cancel(); } catch (e) {} }
        }

        function _copyText(text) {
            // 纯文本复制：优先 Clipboard API，失败降级隐藏 textarea；返回是否成功
            const fallback = () => {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.setAttribute('readonly', '');
                ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
                document.body.appendChild(ta);
                ta.focus(); ta.select();
                let ok = false;
                try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
                ta.remove();
                return ok;
            };
            if (navigator.clipboard && window.isSecureContext) {
                return navigator.clipboard.writeText(text).then(() => true).catch(() => fallback());
            }
            return Promise.resolve(fallback());
        }
        async function copyMessage(text) {
            const ok = await _copyText(text);
            toast(ok ? '已复制消息' : '复制失败，请手动选择文字', ok ? 'success' : 'error');
            return ok;
        }
        async function shareMessage(row) {
            // S1-08：先出可预览的图片卡片弹窗，降级链在弹窗内（分享图片→保存→复制文字）
            if (window.MPCShareCard) {
                const rowPetId = inferPetId(row);
                const pet = PETS.find(p => p.id === rowPetId);
                MPCShareCard.open({
                    message: String(row.message || ''),
                    senderName: String(row.sender || (pet ? pet.name : '') || '宠物'),
                    avatarUrl: petDisplayAvatar(rowPetId),
                    copyText: async () => {
                        const ok = await _copyText(row.message);
                        toast(ok ? '已复制消息' : '复制失败，请手动选择文字', ok ? 'success' : 'error');
                    },
                });
                return;
            }
            // 分享卡片脚本不可用时：沿用文本分享/复制降级
            const text = String(row.message || '');
            if (navigator.share) {
                try {
                    await navigator.share({ title: `来自${row.sender || '宠物'}的陪伴`, text });
                    return;
                } catch (e) {
                    if (e && e.name === 'AbortError') return;   // 用户主动取消：不算错误
                    // 其他异常继续走复制降级
                }
            }
            const ok = await _copyText(text);
            toast(ok ? '已复制，可粘贴分享' : '复制失败，请手动选择文字', ok ? 'info' : 'error');
        }
        // TTS 轻量清理：去掉 Markdown 符号（不动原始消息）
        function ttsCleanText(md) {
            return String(md || '')
                .replace(/```[\s\S]*?```/g, ' ')                    // 代码块不朗读
                .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')            // 链接只读文字
                .replace(/[*_`#>~|]/g, '')
                .replace(/\s+/g, ' ')
                .trim()
                .slice(0, 500);
        }
        function browserFallbackSpeak(text) {
            if (!window.speechSynthesis) { toast('朗读暂不可用', 'error'); return; }
            try {
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'zh-CN';
                speechSynthesis.cancel();
                speechSynthesis.speak(u);
                toast('已切换为浏览器语音朗读', 'info');
            } catch (e) {}
        }
        async function speakMessage(row, button) {
            if (activeSpeakButton === button) { stopSpeaking(); return; }   // 播放中再点同一按钮 = 停止
            stopSpeaking();
            const text = ttsCleanText(row.message);
            if (!text) { toast('这条消息没有可朗读的文字', 'info'); return; }
            // v1.0.0：拟声词（汪汪/喵/嗷呜…）不再人声朗读，改为真实叫声与人声顺序拼接
            if (window.PetSounds) {
                const segs = PetSounds.split(text, inferPetId(row) || currentPet().id);
                if (PetSounds.hasSound(segs)) {
                    stopSpeaking();
                    activeSpeakButton = button;
                    button.disabled = false;
                    button.textContent = '停止';
                    activePetPlayer = PetSounds.play(segs, inferPetId(row) || currentPet().id);
                    activePetPlayer.promise.finally(() => {
                        if (activeSpeakButton === button) stopSpeaking();
                    });
                    return;
                }
            }
            const epoch=speechEpoch;
            activeSpeakButton=button;
            button.disabled = true;
            button.textContent = '生成中…';
            try {
                const resp = await fetch('/api/tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text,
                        petId: inferPetId(row) || currentPet().id,
                    }),
                });
                if (!resp.ok) throw new Error('tts ' + resp.status);
                const blob = await resp.blob();
                if(epoch!==speechEpoch)return;
                activeAudioUrl = URL.createObjectURL(blob);
                activeAudio = new Audio(activeAudioUrl);
                activeSpeakButton = button;
                button.disabled = false;
                button.textContent = '停止';
                activeAudio.onended = stopSpeaking;
                activeAudio.onerror = () => { stopSpeaking(); toast('朗读失败', 'error'); };
                await activeAudio.play();
            } catch (e) {
                if(epoch!==speechEpoch)return;
                button.disabled = false;
                button.textContent = '朗读';
                browserFallbackSpeak(text);
            }
        }
        // 事件委托：整个消息区只挂一个监听器
        messagesEl.addEventListener('click', async (event) => {
            const button = event.target.closest('.msg-action');
            if (!button || !messagesEl.contains(button)) return;
            const actions = button.closest('.msg-actions');
            const row = actions && messageRegistry.get(actions.dataset.messageId);
            if (!row) {
                toast('这条消息暂时无法操作', 'error');
                return;
            }
            const action = button.dataset.action;
            if (action === 'copy') await copyMessage(row.message);
            else if (action === 'share') await shareMessage(row);
            else if (action === 'speak') await speakMessage(row, button);
        });

        // ---------- 宠物选择条 ----------
        function renderStrip() {
            stripEl.innerHTML = '';
            PETS.forEach((pet, i) => {
                const b = document.createElement('button');
                b.className = 'pet-tile' + (i === currentPetIndex && !useCustomAvatar ? ' selected' : '');

                b.addEventListener('click', () => selectPet(i));
                stripEl.appendChild(b);

            // 自定义头像 tile（上传后存在）
            if (customAvatarUrl) {

            const up = document.createElement('button');

        function selectPet(i, silent) {
            if (i === currentPetIndex && !silent) { renderStrip(); return; }

        // ---------- 发送 ----------
        async function doSend(text) {
            const message = (text || '').trim();
            if (!message || sending) return;

            sending = true;
            retryMessage = message;
            inputEl.value = '';
            autosize();

            const pet = currentPet();
            const userRow = { role: 'user', sender: prefs.nickname || '我', message, petId: pet.id, ...messageTimeFields() };
            history.push(userRow);
            saveHistory();
            appendHtml(bubbleHtml(userRow));
            showTyping(pet);
            setSending(true);

            try {
                const resp = await fetch('/get_gpt_response', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message, requestId:crypto.randomUUID(), surface:'chat',
                        chatHistory: history.slice(0, -1),   // 不含刚发的这条，后端会拼
                        model: prefs.model,
                        petId: pet.id,
                        petGender: window.PetProfile ? PetProfile.promptValue(PetProfile.get(pet.id).gender) : null,
                    }),
                });
                const data = await resp.json();
                if (data.reply) {
                    hideTyping();
                    const replyPet = data.pet || pet;
                    const replyRow = {
                        role: 'assistant',
                        sender: replyPet.name,
                        message: data.reply,
                        petId: replyPet.id,
                        ...messageTimeFields(),
                    };
                    history.push(replyRow);
                    saveHistory();
                    appendHtml(bubbleHtml(replyRow));
                } else {
                    showErrorBubble(data.error || 'AI 服务暂时不可用');
                }
            } catch (e) {
                showErrorBubble('网络异常，消息没有发出去');
            } finally {
                sending = false;
                setSending(false);
                inputEl.focus();
            }
        }

        function exportPdf() {
            toast('正在生成 PDF…', 'info');
            html2canvas(messagesEl).then(canvas => {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                const pdfW = pdf.internal.pageSize.getWidth();
                const pdfH = pdf.internal.pageSize.getHeight();
                const imgW = pdfW;
                const imgH = canvas.height * imgW / canvas.width;
                let y = 0;
                while (y < canvas.height) {
                    const pageH = Math.min(canvas.height - y, pdfH * canvas.width / pdfW);
                    const pc = document.createElement('canvas');
                    pc.width = canvas.width; pc.height = pageH;
                    pc.getContext('2d').drawImage(canvas, 0, y, canvas.width, pageH, 0, 0, canvas.width, pageH);
                    pdf.addImage(pc.toDataURL('image/png'), 'PNG', 0, 0, imgW, imgH);
                    y += pageH;
                    if (y < canvas.height) pdf.addPage();
                }
                pdf.save('chat-history.pdf');
                toast('PDF 已导出', 'success');
            }).catch(() => toast('PDF 生成失败', 'error'));

        async function init() {

            try { prefs = Object.assign(prefs, JSON.parse(lsGet(PREFS_KEY) || '{}')); } catch (e) {}
            customAvatarUrl = lsGet(AVATAR_KEY);
            useCustomAvatar = !!customAvatarUrl;

            selectPet(currentPetIndex, true);
            renderStrip();

            // 恢复最近 50 条历史（旧格式条目无 role：仅展示，不进 LLM 上下文）
            const rows = history.slice(-HISTORY_CAP);
            if (rows.length === 0) {
                showGreeting();
            } else {
                // 旧记录缺 localId：渲染时统一补齐，全部渲染完只保存一次（不逐条写 localStorage）
                const needsSave = rows.some(r => r && r.message && (r.role === 'user' || r.role === 'assistant') && !r.localId);
                rows.forEach(r => {
                    if (r && r.message && (r.role === 'user' || r.role === 'assistant')) {
                        appendHtml(bubbleHtml(r));
                    }
                });
                if (needsSave) saveHistory();
            }
            inputEl.focus();
        }
        const memoryLink=document.createElement('a');memoryLink.href='/companion';memoryLink.textContent='陪伴档案';memoryLink.className='btn btn-sm';memoryLink.style.margin='8px';$('btn-diary').parentElement.append(memoryLink);
        init();
    })();
    </script>
</body>
</html>
