<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宠物小窝 · MPC 宠物聊天</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <style>
        html, body { height: 100%; }
        body.theme { padding-top: var(--nav-h); margin: 0; overflow: hidden; background: var(--c-bg); }
        #den-wrap { position: fixed; inset: var(--nav-h) 0 0 0; }
        #den-canvas { width: 100%; height: 100%; display: block; touch-action: none; }

        /* 顶部宠物切换 chips */
        .den-pets {
            position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; z-index: 10;
            background: var(--c-card); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border-radius: 999px; padding: 6px 10px; box-shadow: var(--shadow);
        }
        .den-pet-chip {
            display: flex; align-items: center; gap: 6px;
            border: none; background: none; cursor: pointer;
            padding: 4px 10px; border-radius: 999px; font-size: 13px;
            color: var(--c-text-sub); font-family: var(--font-body);
        }
        .den-pet-chip img {
            width: 30px; height: 30px; border-radius: 50%; object-fit: cover;
            border: 2px solid transparent; transition: border-color .15s;
        }
        .den-pet-chip.selected { color: var(--c-primary-deep); font-weight: 700; }
        .den-pet-chip.selected img { border-color: var(--c-primary); }

        /* 亲密度面板（左上） */
        .intimacy-panel {
            position: absolute; top: 12px; left: 12px; z-index: 10;
            background: var(--c-card); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border-radius: var(--radius-card); box-shadow: var(--shadow);
            padding: 12px 16px; min-width: 180px;
        }
        .intimacy-panel h4 { margin: 0 0 4px; font-size: 14px; }
        .intimacy-panel .level { color: var(--c-primary-deep); font-weight: 700; font-size: 13px; }
        .bar { height: 8px; background: var(--c-disabled-bg); border-radius: 999px; overflow: hidden; margin-top: 6px; }
        .bar > div {
            height: 100%; background: linear-gradient(90deg, var(--c-primary), #F5A623);
            border-radius: 999px; transition: width .5s ease;
        }
        .intimacy-panel .hint { font-size: 11px; color: var(--c-text-sub); margin-top: 6px; }

        /* 动作按钮（底部中央） */
        .action-bar {
            position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; z-index: 10; flex-wrap: wrap; justify-content: center;
            max-width: 96vw;
        }
        .action-btn {
            display: inline-flex; align-items: center; gap: 6px;
            height: 38px; padding: 0 16px; border-radius: 999px; border: none;
            background: var(--c-card); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            box-shadow: var(--shadow); cursor: pointer; font-size: 14px;
            color: var(--c-text); font-family: var(--font-body);
            transition: transform .12s, background .12s;
        }
        .action-btn:hover { transform: translateY(-2px); background: #fff; }
        .action-btn:active { transform: translateY(0); }
        .action-btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }

        /* 场景内气泡 */
        .bubble-tip {
            position: absolute; z-index: 9; pointer-events: none;
            background: rgba(255,255,255,.95); color: var(--c-text);
            border-radius: 12px; padding: 8px 14px; font-size: 14px;
            box-shadow: var(--shadow); max-width: 260px;
            opacity: 0; transform: translateY(6px); transition: opacity .25s, transform .25s;
        }
        .bubble-tip.show { opacity: 1; transform: translateY(0); }

        /* 聊天抽屉（右侧） */
        .den-chat {
            position: absolute; top: 64px; right: 12px; bottom: 72px; z-index: 11;
            width: min(340px, 88vw);
            display: flex; flex-direction: column;
            background: var(--c-card); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border-radius: var(--radius-card); box-shadow: var(--shadow-hover);
            overflow: hidden;
            transition: transform .3s ease, opacity .3s ease;
        }
        .den-chat.hidden { transform: translateX(110%); opacity: 0; pointer-events: none; }
        .den-chat header {
            padding: 10px 14px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--c-line); font-size: 14px; font-weight: 700;
        }
        .den-chat .msgs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .den-chat .m { max-width: 86%; padding: 8px 12px; border-radius: 12px; font-size: 13px; line-height: 1.5; }
        .den-chat .m.user { align-self: flex-end; background: var(--c-bubble-user); }
        .den-chat .m.pet { align-self: flex-start; background: #fff; box-shadow: var(--shadow); }
        .den-chat .m .who { font-size: 11px; color: var(--c-text-sub); margin-bottom: 2px; }
        .den-chat form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--c-line); }
        .den-chat input {
            flex: 1; height: 36px; border: 1px solid var(--c-line); border-radius: 999px;
            padding: 0 14px; font-size: 13px; font-family: var(--font-body);
        }
        .den-chat input:focus { outline: none; border-color: var(--c-primary); }
        .den-chat button {
            height: 36px; padding: 0 16px; border: none; border-radius: 999px;
            background: var(--c-primary); color: var(--c-text); font-weight: 700; cursor: pointer;
        }
        .den-chat button:disabled { background: var(--c-disabled-bg); color: var(--c-disabled-text); cursor: not-allowed; }

        .toast-container { z-index: 300; }

        /* ---------- 视觉互动（本地推理，画面不上传） ---------- */
        .vision-box { position: absolute; right: 12px; bottom: 76px; width: 138px; z-index: 25;
            background: rgba(255,255,255,.92); border: 1px solid var(--c-line); border-radius: 14px;
            padding: 6px; box-shadow: 0 6px 18px rgba(74,59,50,.14); }
        .vision-box video { width: 100%; border-radius: 9px; transform: scaleX(-1); background: #2f2620; display: block; }
        .vision-status { font-size: 11px; line-height: 1.5; color: var(--c-text-sub); padding: 4px 2px 1px; }
        .vision-status b { color: var(--c-text); font-weight: 700; }
        .vision-privacy { font-size: 10px; color: var(--c-text-sub); opacity: .8; padding: 0 2px 2px; }
        #vision-hand { position: absolute; left: 0; top: 0; z-index: 22; pointer-events: none;
            opacity: 0; will-change: transform; line-height: 1;
            filter: drop-shadow(0 4px 8px rgba(74,59,50,.25)); }
        #vision-hand.reaching { filter: drop-shadow(0 6px 10px rgba(232,131,60,.45)); }

        /* ---------- 心理治愈：心情打卡 / 呼吸练习 / 倾诉 chips ---------- */
        .mood-mask, .breath-mask { position: fixed; inset: 0; z-index: 200; display: flex;
            align-items: center; justify-content: center; }
        .mood-mask { background: rgba(74,59,50,.45); backdrop-filter: blur(2px); }
        .mood-mask[hidden], .breath-mask[hidden] { display: none; }
        .mood-card { width: min(92vw, 380px); background: #FFFDF8; border-radius: 18px; padding: 22px;
            box-shadow: 0 14px 40px rgba(74,59,50,.25); }
        .mood-card h3 { margin: 0 0 4px; font-size: 17px; color: var(--c-text); }
        .mood-card .sub { font-size: 12px; color: var(--c-text-sub); margin-bottom: 14px; }
        .mood-row { display: flex; gap: 8px; margin-bottom: 14px; }
        .mood-opt { flex: 1; border: 2px solid var(--c-line); background: #fff; border-radius: 12px;
            padding: 8px 2px 6px; text-align: center; cursor: pointer; transition: .15s; }
        .mood-opt .e { font-size: 24px; display: block; }
        .mood-opt .t { font-size: 11px; color: var(--c-text-sub); }
        .mood-opt:hover { transform: translateY(-2px); }
        .mood-opt.sel { border-color: var(--c-primary); background: #FFF3E4; }
        .mood-note { width: 100%; border: 1px solid var(--c-line); border-radius: 10px; padding: 8px 12px;
            font-size: 13px; font-family: var(--font-body); margin-bottom: 12px; resize: none; }
        .mood-note:focus { outline: none; border-color: var(--c-primary); }
        .mood-week { display: flex; gap: 6px; margin-bottom: 14px; }
        .mood-week .d { flex: 1; text-align: center; font-size: 10px; color: var(--c-text-sub); }
        .mood-week .d b { display: block; font-size: 17px; font-weight: 400; }
        .mood-card .btn-row { display: flex; gap: 10px; }
        .mood-card .btn-row button { flex: 1; height: 38px; border: none; border-radius: 999px; cursor: pointer;
            font-family: var(--font-body); font-weight: 700; }
        .mood-ok { background: var(--c-primary); color: var(--c-text); }
        .mood-cancel { background: transparent; color: var(--c-text-sub); border: 1px solid var(--c-line) !important; }
        .streak-tip { text-align: center; font-size: 11px; color: var(--c-primary); margin-top: 10px; }
        .breath-mask { background: radial-gradient(circle at 50% 45%, rgba(255,214,165,.42), rgba(74,59,50,.38));
            flex-direction: column; cursor: pointer; }
        .breath-circle { width: 150px; height: 150px; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,.95), rgba(255,214,165,.85));
            box-shadow: 0 0 60px rgba(255,200,140,.7); display: flex; align-items: center; justify-content: center;
            transition: transform 3.8s cubic-bezier(.4,0,.6,1); font-size: 40px; }
        .breath-text { margin-top: 26px; font-size: 19px; color: #fff; text-shadow: 0 2px 10px rgba(74,59,50,.5);
            letter-spacing: 2px; }
        .breath-round { margin-top: 8px; font-size: 12px; color: rgba(255,255,255,.85); }
        .breath-close { position: absolute; top: 18px; right: 22px; color: #fff; font-size: 13px;
            background: rgba(255,255,255,.18); border: none; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
        .chat-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px 0; }
        .chat-chips button { border: 1px solid var(--c-line); background: #FFF6EC; color: var(--c-text-sub);
            border-radius: 999px; font-size: 11px; padding: 4px 10px; cursor: pointer; font-family: var(--font-body); }
        .chat-chips button:hover { border-color: var(--c-primary); color: var(--c-text); }

        @media (max-width: 767px) {
            .intimacy-panel { top: 66px; min-width: 150px; padding: 10px 12px; }
            .den-pets { top: 64px; }
            .den-chat { top: 120px; bottom: 116px; }
            /* 视觉预览窗挪到左下，避开右侧聊天抽屉 */
            .vision-box { left: 8px; right: auto; bottom: 76px; width: 108px; }
            #vision-hand { font-size: 34px !important; }
        }
    </style>
</head>
<body class="theme">
    {% include '_navbar.html' %}
    <div id="den-wrap">
        <canvas id="den-canvas"></canvas>

        <div class="den-pets" id="den-pets"></div>

        <div class="intimacy-panel" id="intimacy-panel">
            <h4 id="ip-name">小窝</h4>
            <div>亲密度 <span class="level" id="ip-level">初次见面</span> <span id="ip-num" class="text-sub" style="font-size:12px;">0/10</span></div>
            <div class="bar"><div id="ip-bar" style="width:0%"></div></div>
            <div class="hint" id="ip-hint">摸摸它、喂它好吃的、陪它聊天都能提升亲密度</div>
        </div>

        <div class="bubble-tip" id="bubble"></div>

        <div class="action-bar">
            <button class="action-btn" id="btn-pet">🤚 摸摸</button>
            <button class="action-btn" id="btn-feed-bone">🦴 骨头</button>
            <button class="action-btn" id="btn-feed-fish">🐟 小鱼干</button>
            <button class="action-btn" id="btn-feed-cookie">🍪 饼干</button>
            <button class="action-btn" id="btn-dress">🎩 换装</button>
            <button class="action-btn" id="btn-photo">📸 拍照</button>
            <button class="action-btn" id="btn-vision">👁 眼神互动</button>
            <button class="action-btn" id="btn-tts">🔊 语音</button>
            <button class="action-btn" id="btn-mood">💗 心情</button>
            <button class="action-btn" id="btn-breath">🫁 呼吸</button>
            <button class="action-btn" id="btn-chat">💬 聊天</button>
            <button class="action-btn" id="btn-music">🎵 音乐</button>
        </div>

        <div class="den-chat hidden" id="den-chat">
            <header>
                <span id="chat-title">和小家伙聊天</span>
                <button class="icon-btn" id="btn-chat-close" aria-label="收起聊天" style="width:28px;height:28px;">✕</button>
            </header>
            <div class="msgs" id="chat-msgs"></div>
            <div class="chat-chips" id="chat-chips">
                <button type="button" data-say="我今天有点难过，你能陪陪我吗">有点难过 😢</button>
                <button type="button" data-say="我最近好焦虑，心里静不下来">好焦虑 😰</button>
                <button type="button" data-say="压力好大，感觉快撑不住了">压力好大 😮‍💨</button>
                <button type="button" data-say="最近总是睡不着，心里乱乱的">睡不着 🌙</button>
                <button type="button" data-say="没什么特别的事，就想和你聊聊">就想聊聊 💬</button>
            </div>
            <form id="chat-form">
                <input id="chat-input" placeholder="和它说点什么…" autocomplete="off" maxlength="200">
                <button type="submit" id="chat-send">发送</button>
            </form>
        </div>

        <!-- 心理治愈：心情打卡 -->
        <div class="mood-mask" id="mood-mask" hidden>
            <div class="mood-card" role="dialog" aria-label="今日心情">
                <h3>今天心情怎么样？</h3>
                <div class="sub">告诉它，它会一直陪着你</div>
                <div class="mood-row" id="mood-row">
                    <div class="mood-opt" data-mood="happy" data-label="开心"><span class="e">😊</span><span class="t">开心</span></div>
                    <div class="mood-opt" data-mood="calm" data-label="平静"><span class="e">🙂</span><span class="t">平静</span></div>
                    <div class="mood-opt" data-mood="low" data-label="低落"><span class="e">😔</span><span class="t">低落</span></div>
                    <div class="mood-opt" data-mood="anxious" data-label="焦虑"><span class="e">😰</span><span class="t">焦虑</span></div>
                    <div class="mood-opt" data-mood="sad" data-label="难过"><span class="e">😢</span><span class="t">难过</span></div>
                </div>
                <textarea class="mood-note" id="mood-note" rows="2" maxlength="120" placeholder="想说点什么给它听？（选填）"></textarea>
                <div class="mood-week" id="mood-week"></div>
                <div class="btn-row">
                    <button class="mood-cancel" id="mood-cancel">先不了</button>
                    <button class="mood-ok" id="mood-ok">告诉它</button>
                </div>
                <div class="streak-tip" id="mood-streak"></div>
            </div>
        </div>

        <!-- 心理治愈：呼吸练习 -->
        <div class="breath-mask" id="breath-mask" hidden>
            <button class="breath-close" id="breath-close">结束练习</button>
            <div class="breath-circle" id="breath-circle">🐾</div>
            <div class="breath-text" id="breath-text">准备好了就开始啦</div>
            <div class="breath-round" id="breath-round"></div>
        </div>

        <!-- 视觉互动：本地 WASM 推理，摄像头画面不上传 -->
        <div class="vision-box hidden" id="vision-box">
            <video id="vision-cam" autoplay playsinline muted></video>
            <div class="vision-status" id="vision-status">启动中…</div>
            <div class="vision-privacy">🔒 画面仅本地处理，不会上传</div>
        </div>
        <div id="vision-hand" aria-hidden="true">🤚</div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script src="{{ url_for('static', filename='js/vendor/three.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/vendor/OrbitControls.js') }}"></script>
    <script src="{{ url_for('static', filename='js/vendor/GLTFLoader.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/den_vision.js') }}"></script>
    <script>
    /* ============================================================
       3D 宠物小窝 —— Quaternius CC0 骨骼动画 GLB 模型 + 交互系统
       （模型本地 static/models/，零外部请求；配饰/亲密度/视觉互动保留）
       ============================================================ */
    (function () {
        'use strict';
        if (!window.THREE) { toast('3D 引擎加载失败', 'error'); return; }

        // ---------- 宠物规格（程序化建模参数） ----------
        const PETS = {{ pets | tojson }};
        const MODELS = {{ models | tojson }};
        const SPECS = {
            1: { name: '柴犬', glb: '/static/models/shiba.glb', h: 0.95,
                 greet: '汪！欢迎来到我的小窝，摸摸我吧！',
                 anims: { idle: 'Idle', happy: 'Gallop_Jump', eat: 'Eating', petting: 'Idle_2_HeadLow', talk: 'Idle_2', sleep: 'Death', blinkL: 'Idle_HitReact_Left', blinkR: 'Idle_HitReact_Right' },
                 theme: 'sakura', themeName: '樱花庭院' },
            2: { name: '哈士奇', glb: '/static/models/husky.glb', h: 1.05,
                 greet: '嗷呜~ 帅气的我在等你一起玩呢！',
                 anims: { idle: 'Idle', happy: 'Gallop_Jump', eat: 'Eating', petting: 'Idle_2_HeadLow', talk: 'Idle_2', sleep: 'Death', blinkL: 'Idle_HitReact_Left', blinkR: 'Idle_HitReact_Right' },
                 theme: 'snow', themeName: '静静雪原' },
            3: { name: '猫咪', glb: '/static/models/cat.glb', h: 0.72,
                 greet: '喵~ 我的窝就是你的窝（才不让你走呢）。',
                 anims: { idle: 'Idle', happy: 'Jump_Loop', eat: 'Idle_Eating', petting: 'Idle', talk: 'Idle', sleep: 'Death', blinkL: 'Idle_HitReact_Left', blinkR: 'Idle_HitReact_Right' },
                 theme: 'room', themeName: '温馨小窝' },
            4: { name: '德牧', glb: '/static/models/shepherd.glb', h: 1.08,
                 greet: '汪！忠诚卫士报到，今天想玩点什么？',
                 anims: { idle: 'Idle', happy: 'Run_Jump', eat: 'Eating', petting: 'Idle_2_HeadLow', talk: 'Idle_2', sleep: 'Death', blinkL: 'Idle_HitReact_Left', blinkR: 'Idle_HitReact_Right' },
                 theme: 'camp', themeName: '星空营地' },
        };
        const LEVELS = [
            [0, '初次见面'], [10, '有点熟悉'], [30, '心情不错'],
            [60, '好朋友'], [90, '挚爱伙伴'], [150, '灵魂挚友'],
        ];

        // ---------- 本地状态 ----------
        const LS_KEY = 'denState';
        function loadState() {
            try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}'); }
            catch (e) { return {}; }
        }
        function saveState() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }
        const state = loadState();
        let currentPetId = Number(Object.keys(SPECS)[0]);
        function petState() {
            if (!state[currentPetId]) state[currentPetId] = { intimacy: 0, accessory: 0 };
            return state[currentPetId];
        }

        // ---------- 渲染基础 ----------
        const canvas = document.getElementById('den-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
        camera.position.set(2.6, 2.2, 4.2);
        camera.lookAt(0, 0.8, 0);

        const controls = new THREE.OrbitControls(camera, canvas);
        controls.target.set(0, 0.8, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 2.2;
        controls.maxDistance = 9;
        controls.maxPolarAngle = Math.PI / 2.05;

        // 光照
        const hemi = new THREE.HemisphereLight(0xfff4e0, 0xcbb59a, 0.85);
        scene.add(hemi);
        const sun = new THREE.DirectionalLight(0xffffff, 0.9);
        sun.position.set(3, 6, 4);
        sun.castShadow = true;
        sun.shadow.mapSize.set(1024, 1024);
        sun.shadow.camera.left = -5; sun.shadow.camera.right = 5;
        sun.shadow.camera.top = 5; sun.shadow.camera.bottom = -5;
        scene.add(sun);

        // 地面与小窝布景（草地纹理地面 + 地毯 + 灌木）
        const grassTex = new THREE.TextureLoader().load('/static/images/grasslight-big.jpg');
        grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping;
        grassTex.repeat.set(5, 5);
        grassTex.encoding = THREE.sRGBEncoding;
        const groundMat = new THREE.MeshLambertMaterial({ map: grassTex, color: 0xE8E0D0 });
        const ground = new THREE.Mesh(new THREE.CircleGeometry(7, 48), groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);
        const rug = new THREE.Mesh(
            new THREE.CircleGeometry(1.7, 40),
            new THREE.MeshLambertMaterial({ color: 0xFFD9B3 }));
        rug.rotation.x = -Math.PI / 2;
        rug.position.y = 0.01;
        rug.receiveShadow = true;
        scene.add(rug);
        // ---------- 每宠专属场景主题（装饰/地面/环境粒子） ----------
        const decorGroup = new THREE.Group();
        scene.add(decorGroup);
        let currentTheme = null;
        const M = (c) => new THREE.MeshLambertMaterial({ color: c });

        const THEMES = {

            room: {     // 温馨小窝：木地板 + 纸箱 + 毛线球 + 串灯

                    tent.position.set(-2.2, 0, -1.2);
                    g.add(tent);

                        post.position.set(-0.6 + i * 0.75, 0.27, -2.3); post.castShadow = true; g.add(post);
                        if (i < 3) {
                            const rail = new THREE.Mesh(new THREE.BoxGeometry(0.78, 0.07, 0.06), M(0xA88868));
                            rail.position.set(-0.225 + i * 0.75, 0.4, -2.3); g.add(rail);

        // 环境粒子（樱花/落雪/微尘/星光，主题切换时重建；纹理缓存复用避免重复创建）
        let envSprites = [];
        let themeFireLight = null, themeFlame = null;   // tick 用引用缓存，避免每帧 getObjectByName
        const envTexCache = {};
        function disposeObjectTree(root) {
            root.traverse((o) => {
                if (o.geometry) o.geometry.dispose();
                if (o.material) {
                    (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => m.dispose());
                }
            });
        }
        function applyTheme(name) {
            const t = THEMES[name];
            if (!t) return;
            currentTheme = name;
            disposeObjectTree(decorGroup);   // 显式释放 GPU 资源，防止反复切宠累积
            while (decorGroup.children.length) decorGroup.remove(decorGroup.children[0]);
            themeFireLight = null; themeFlame = null;
            t.build(decorGroup);
            themeFireLight = decorGroup.getObjectByName('__fireLight') || null;
            themeFlame = decorGroup.getObjectByName('__flame') || null;
            rug.material.color.setHex(t.rug);
            applyTimeOfDay();
            envSprites.forEach((s) => { scene.remove(s); s.material.dispose(); });
            envSprites = [];
            if (!envTexCache[t.env.ch]) envTexCache[t.env.ch] = emojiTexture(t.env.ch);
            const tex = envTexCache[t.env.ch];
            for (let i = 0; i < t.env.n; i++) {
                const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.75 }));
                const sz = t.env.tiny ? 0.1 + Math.random() * 0.08 : 0.16 + Math.random() * 0.12;
                sp.scale.setScalar(sz);
                sp.position.set((Math.random() - 0.5) * 7, Math.random() * 3, (Math.random() - 0.5) * 7);
                sp.userData = { v: (t.env.rise ? 0.1 : -0.12) - Math.random() * 0.1, sway: Math.random() * Math.PI * 2, rise: t.env.rise };
                scene.add(sp);
                envSprites.push(sp);
            }
        }

        // 昼夜背景（?scene=night/morning/day/dusk 可强制指定，便于演示与验收）
        function applyTimeOfDay() {
            const q = new URLSearchParams(location.search).get('scene');
            let h = new Date().getHours();
            if (q === 'night') h = 22; else if (q === 'morning') h = 7;
            else if (q === 'day') h = 12; else if (q === 'dusk') h = 18;
            let sky, fog, sunI;
            if (h >= 6 && h < 9) { sky = 0xFFE0C0; fog = 0xFFE0C0; sunI = 0.75; }        // 清晨
            else if (h >= 9 && h < 17) { sky = 0xCDEBF7; fog = 0xCDEBF7; sunI = 0.95; }  // 白天
            else if (h >= 17 && h < 20) { sky = 0xFFC9A3; fog = 0xFFC9A3; sunI = 0.6; }  // 黄昏
            else { sky = 0x3E4A6B; fog = 0x3E4A6B; sunI = 0.35; }                        // 夜晚
            scene.background = new THREE.Color(sky);
            scene.fog = new THREE.Fog(fog, 9, 22);
            sun.intensity = sunI;
            hemi.intensity = 0.5 + sunI * 0.4;
            // 地面随昼夜明暗 + 主题配色（雪原/木地板为纯色，庭院/营地为草地贴图）
            const gnd = (currentTheme && THEMES[currentTheme]) ? THEMES[currentTheme].ground : { grass: true, day: 0xe8e0d0, dusk: 0xc8c2b8, night: 0x8a8a96 };
            groundMat.map = gnd.grass ? grassTex : null;
            groundMat.needsUpdate = true;
            groundMat.color.setHex(sunI < 0.5 ? (gnd.night || 0x8a8a96) : sunI < 0.8 ? (gnd.dusk || 0xc8c2b8) : (gnd.day || 0xe8e0d0));
            // 夜晚/黄昏给宠物加一盏暖色"窝灯"，避免主体打光过平
            if (sunI < 0.65) {
                if (!window.__denLamp) {
                    window.__denLamp = new THREE.PointLight(0xFFD9A0, 1.1, 8);
                    window.__denLamp.position.set(-2.2, 1.8, 1.6);   // 左前暖光
                    scene.add(window.__denLamp);
                }
                window.__denLamp.intensity = 1.2 - sunI;
                // 右后冷色轮廓光：与暖灯形成冷暖对比，夜间立体感
                if (!window.__denRim) {
                    window.__denRim = new THREE.PointLight(0x6B7FBF, 0.6, 10);
                    window.__denRim.position.set(2.6, 1.4, -2.2);
                    scene.add(window.__denRim);
                }
                window.__denRim.intensity = 0.6;
            } else if (window.__denLamp) {
                window.__denLamp.intensity = 0;
                if (window.__denRim) window.__denRim.intensity = 0;
            }
        }

        // ---------- GLB 宠物（Quaternius CC0 动物包，本地 static/models，带骨骼动画） ----------
        const gltfCache = {};
        const gltfLoader = new THREE.GLTFLoader();
        const clipShort = (n) => n.replace(/^.*\|/, '');
        function loadGlb(url) {
            if (!gltfCache[url]) {
                gltfCache[url] = new Promise((resolve, reject) => {
                    gltfLoader.load(url, resolve, undefined, reject);
                });
            }
            return gltfCache[url];
        }

        // 配饰（帽子/围巾/蝴蝶结）：优先挂头/颈骨骼（跟随动画），无骨骼则按体高近似
        // 幂等：gltfCache 会复用同一 scene，二次 spawn 同一宠物时按名字找回已挂配饰，避免重复叠加
        function buildAccessories(model, headBone, neckBone, origH) {
            const k = origH;
            const reuse = (name) => model.getObjectByName(name) || null;
            let hatGroup = reuse('__den_hat');
            let scarf = reuse('__den_scarf');
            let bow = reuse('__den_bow');
            if (!hatGroup) {
                const M = (c) => new THREE.MeshLambertMaterial({ color: c });
                const hat = new THREE.Mesh(new THREE.ConeGeometry(0.2 * k, 0.36 * k, 16), M(0xFF7BA9));
                hat.position.set(0, 0.2 * k, 0);
                const brim = new THREE.Mesh(new THREE.TorusGeometry(0.21 * k, 0.035 * k, 8, 20), M(0xFFFFFF));
                brim.position.set(0, 0.03 * k, 0); brim.rotation.x = Math.PI / 2;
                hatGroup = new THREE.Group(); hatGroup.add(hat); hatGroup.add(brim);
                hatGroup.name = '__den_hat';
                hatGroup.rotation.z = 0.14;
                if (headBone) { hatGroup.position.set(0, 0.1 * k, 0.05 * k); headBone.add(hatGroup); }
                else { hatGroup.position.set(0, 0.92, 0.16); model.add(hatGroup); }
            }
            if (!scarf) {
                scarf = new THREE.Mesh(new THREE.TorusGeometry(0.34 * k, 0.075 * k, 10, 24),
                    new THREE.MeshLambertMaterial({ color: 0xE5735B }));
                scarf.name = '__den_scarf';
                scarf.rotation.x = 0.35;
                if (neckBone) { scarf.position.set(0, 0.02 * k, 0.04 * k); neckBone.add(scarf); }
                else { scarf.position.set(0, 0.6, 0.34); model.add(scarf); }
            }
            if (!bow) {
                bow = new THREE.Group();
                const M2 = (c) => new THREE.MeshLambertMaterial({ color: c });
                [-1, 1].forEach((side) => {
                    const wing = new THREE.Mesh(new THREE.ConeGeometry(0.15 * k, 0.3 * k, 10), M2(0xFF9E58));
                    wing.rotation.z = Math.PI / 2 * side;
                    wing.position.x = 0.16 * k * side;
                    wing.scale.set(1, 1, 0.7);
                    bow.add(wing);
                });
                const knot = new THREE.Mesh(new THREE.SphereGeometry(0.075 * k, 10, 8), M2(0xE8833C));
                bow.add(knot);
                bow.name = '__den_bow';
                bow.rotation.y = 0.45; bow.scale.setScalar(1.2);
                if (headBone) { bow.position.set(0.28 * k, 0.0, 0.12 * k); headBone.add(bow); }
                else { bow.position.set(0.28, 0.78, 0.22); model.add(bow); }
            }
            hatGroup.visible = false; scarf.visible = false; bow.visible = false;
            petModel.userData.accessories = [hatGroup, scarf, bow];
        }

        // ---------- 动画状态机（GLB AnimationMixer 驱动） ----------
        let petModel = null;
        let mixer = null, actions = {}, activeAction = null;
        const anim = { state: 'idle', until: 0, lastInteract: performance.now(), birth: 1, lie: 0 };
        function playAction(key, timeScale) {
            const a = actions[key];
            if (!a) return;
            a.timeScale = timeScale;
            if (activeAction === a) return;
            a.reset();
            a.setLoop(THREE.LoopRepeat, Infinity);
            a.clampWhenFinished = false;
            if (activeAction) a.crossFadeFrom(activeAction, 0.25, false);
            a.play();
            activeAction = a;
        }
        // 睡觉：播「倒下」动画一次并定格在躺平末帧（Death 片段即躺倒姿势），之后由 tick 做极慢呼吸起伏
        function playSleep() {
            const a = actions.sleep;
            if (!a) { playAction('idle', 0.4); return; }
            a.reset();
            a.setLoop(THREE.LoopOnce, 1);
            a.clampWhenFinished = true;
            a.timeScale = 0.85;            // 慢慢倒下（约2-3秒）
            if (activeAction) a.crossFadeFrom(activeAction, 0.3, false);
            a.play();
            activeAction = a;
        }
        function setAnim(state, dur) {
            anim.state = state;
            anim.until = performance.now() + dur;
            anim.lastInteract = performance.now();
            if (state === 'sleep') { anim.sleptAt = performance.now(); playSleep(); }
            else playAction(state, 1);
        }

        let spawnBusy = false;   // 首载窗口并发守卫
        async function spawnPet(id, fromRollback = false) {
            if (!SPECS[id]) { toast('这只宠物还不认识我们哦', 'error'); return; }
            if (id === currentPetId && (petModel || spawnBusy)) return;   // 快速连点同一只：忽略（含首载窗口）
            const prevId = (petModel && currentPetId !== id) ? currentPetId : null;   // 失败回滚目标（须在改写前捕获）
            spawnBusy = true;
            if (petModel) scene.remove(petModel);
            currentPetId = id;
            if (typeof denHistory !== 'undefined') denHistory = [];   // 聊天记忆逐宠隔离
            const spec = SPECS[id];
            applyTheme(spec.theme);   // 每宠专属场景（需在 spec 定义后）
            // 先刷 UI（加载是异步的，界面不该等）
            renderPetChips();
            updateIntimacyUI();
            document.getElementById('chat-title').textContent = `和${spec.name}聊天`;
            document.getElementById('ip-name').textContent = `${spec.name}的小窝`;
            let gltf;
            try {
                gltf = await loadGlb(spec.glb);
            } catch (e) {
                if (currentPetId !== id) return;   // 已被接管：静默让位（busy 归接管方管理，不误报/不闪回）
                toast('宠物模型加载失败，请刷新重试', 'error');
                gltfCache[spec.glb] = null;     // 清失败缓存（rejected promise 不常驻，下次点击可重试）
                spawnBusy = false;               // 先复位再回滚：子级调用时标志状态正确
                if (prevId && !fromRollback) spawnPet(prevId, true);   // 回滚最多一跳：多资源损坏时不乒乓
                return;
            }
            // 用户等加载期间可能已切换到别的宠物：直接让位，busy 交给接管的 spawn 管理（其退出路径自会复位）
            if (currentPetId !== id) return;
            const model = gltf.scene;
            // 归一化：目标高度、落地、居中（scene 会被缓存复用，先复位上次变换避免二次缩放）
            model.scale.setScalar(1);
            model.position.set(0, 0, 0);
            model.updateMatrixWorld(true);
            // 摘下骨骼上的配饰再量包围盒（Box3 不看 visible，帽尖会让狗二次出现时缩水 1/4）
            const detached = [];
            ['__den_hat', '__den_scarf', '__den_bow'].forEach((n) => {
                const o = model.getObjectByName(n);
                if (o && o.parent) { detached.push([o, o.parent]); o.parent.remove(o); }
            });
            const box = new THREE.Box3().setFromObject(model);
            const origH = Math.max(0.01, box.max.y - box.min.y);
            model.scale.setScalar(spec.h / origH);
            model.updateMatrixWorld(true);
            const box2 = new THREE.Box3().setFromObject(model);
            model.position.set(-(box2.min.x + box2.max.x) / 2, -box2.min.y, -(box2.min.z + box2.max.z) / 2);
            detached.forEach(([o, parentBone]) => parentBone.add(o));   // 配饰挂回原骨骼
            model.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; } });

            mixer = new THREE.AnimationMixer(model);
            actions = {}; activeAction = null;
            for (const [key, wanted] of Object.entries(spec.anims)) {
                const clip = gltf.animations.find((a) => clipShort(a.name) === wanted);
                if (clip) actions[key] = mixer.clipAction(clip);
            }
            if (!actions.idle && gltf.animations[0]) actions.idle = mixer.clipAction(gltf.animations[0]);

            let headBone = null, neckBone = null;
            model.traverse((o) => {
                if (o.isBone) {
                    if (!headBone && /head/i.test(o.name)) headBone = o;
                    if (!neckBone && /neck/i.test(o.name)) neckBone = o;
                }
            });

            const g = new THREE.Group();
            g.add(model);
            g.rotation.y = 0.35;                 // 朝向镜头略侧，展示立体感
            petModel = g;
            petModel.userData = { height: spec.h, headBone, origH, animations: gltf.animations.map(a => clipShort(a.name)) };
            buildAccessories(model, headBone, neckBone, origH);
            scene.add(petModel);
            // 配饰恢复
            const acc = petState().accessory || 0;
            if (acc > 0 && petModel.userData.accessories[acc - 1]) petModel.userData.accessories[acc - 1].visible = true;
            // 出生动画
            g.scale.setScalar(0.01);
            anim.birth = 0;
            setAnim('idle', 0);
            showBubble(spec.greet, 2600);
            spawnBusy = false;
        }

        // ---------- 粒子（emoji 贴图 sprite，本地 canvas 生成） ----------
        const particles = [];
        function emojiTexture(ch) {
            const c = document.createElement('canvas');
            c.width = c.height = 64;
            const ctx = c.getContext('2d');
            ctx.font = '48px serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(ch, 32, 36);

        const TEX = { heart: emojiTexture('💗'), star: emojiTexture('✨'), zzz: emojiTexture('💤'), bone: emojiTexture('🦴'), fish: emojiTexture('🐟'), cookie: emojiTexture('🍪') };

        // ---------- 语音（浏览器本地 TTS，离线、零上传） ----------
        let ttsOn = true;
        let zhVoice = null;
        function refreshVoices() {
            if (!window.speechSynthesis) return;
            const vs = speechSynthesis.getVoices();
            // 优先级：Natural(神经网络) > Online > 普通中文
            zhVoice = vs.find((v) => /natural/i.test(v.name) && /zh/i.test(v.lang)) ||
                      vs.find((v) => /online/i.test(v.name) && /zh/i.test(v.lang)) ||
                      vs.find((v) => /^zh[-_]CN/i.test(v.lang)) ||
                      vs.find((v) => /^zh/i.test(v.lang)) ||
                      vs.find((v) => /Huihui|Yaoyao|Kangkang|Chinese/i.test(v.name)) || null;
        }
        if (window.speechSynthesis) {
            refreshVoices();
            speechSynthesis.onvoiceschanged = refreshVoices;
        }
        let userInteracted = false;   // 浏览器自动播放策略：首次交互前不主动发声（说话动画照常）
        ['pointerdown', 'click', 'keydown', 'touchstart'].forEach(evt => {
            window.addEventListener(evt, () => { userInteracted = true; }, { once: true, passive: true });
        });
        // 页面获得焦点也算交互（从别的标签页切回来）
        window.addEventListener('focus', () => { userInteracted = true; }, { passive: true });
        // 温柔模式参数（TTS 尽量柔和）
        const TTS_GENTLE = { rate: 0.88, pitch: 0.95 };
        // GLM 后端 TTS（真人级）：fire-and-forget，失败降级浏览器语音
        const ttsAudioCache = {};
        function glmTTS(text) {
            const key = text.slice(0, 50);
            if (ttsAudioCache[key]) {
                const audio = new Audio(ttsAudioCache[key]);
                audio.volume = 0.85;
                audio.play();
                return;
            }
            fetch('/api/tts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text }),
            }).then((r) => {
                if (!r.ok) throw new Error('tts ' + r.status);
                return r.blob();
            }).then((blob) => {
                const url = URL.createObjectURL(blob);
                ttsAudioCache[key] = url;
                const audio = new Audio(url);
                audio.volume = 0.85;
                audio.play();
            }).catch(() => {
                // 后端 TTS 失败 → 降级浏览器语音
                browserSpeak(text);
            });
        }
        // 浏览器 SpeechSynthesis 降级
        function browserSpeak(text) {
            if (!window.speechSynthesis) return;
            try {
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'zh-CN';
                u.rate = TTS_GENTLE.rate;
                u.pitch = TTS_GENTLE.pitch;
                if (zhVoice) u.voice = zhVoice;
                speechSynthesis.cancel();
                speechSynthesis.speak(u);
            } catch (e) {}
        }
        function speak(text, opts = {}) {
            const clean = String(text).replace(/[～~♪🎯🎉🧣🎀✨]/g, '').trim().slice(0, 140);
            if (opts.talk !== false && petModel && clean) setAnim('talk', 1200 + clean.length * 60);   // 说话动画不随静音关闭
            if (!ttsOn || !userInteracted || !clean) return;
            // 优先 GLM 后端 TTS（真人级声音），失败自动降级浏览器
            glmTTS(clean);
        }
        document.getElementById('btn-tts').addEventListener('click', function () {
            ttsOn = !ttsOn;
            if (!ttsOn && window.speechSynthesis) speechSynthesis.cancel();
            this.textContent = ttsOn ? '🔊 语音' : '🔇 语音';
            toast(ttsOn ? '宠物开口说话啦' : '宠物语音已静音', 'info');
        });

        // 气泡（显示时同步朗读 → 宠物"会说话"）
        let bubbleTimer = null;
        const bubbleEl = document.getElementById('bubble');
        function showBubble(text, dur, silent) {
            const b = bubbleEl;
            b.textContent = text;
            // 跟随宠物头部投影位置
            const head = petHeadPos().clone().project(camera);
            b.style.left = `${(head.x * 0.5 + 0.5) * canvas.clientWidth + 16}px`;
            b.style.top = `${(-head.y * 0.5 + 0.5) * canvas.clientHeight - 70}px`;
            b.classList.add('show');
            clearTimeout(bubbleTimer);
            bubbleTimer = setTimeout(() => b.classList.remove('show'), dur || 2000);

        // 点击宠物（射线检测）

        const pointer = new THREE.Vector2();
        let lastPetClick = 0;
        canvas.addEventListener('pointerdown', (e) => {
            pointer.x = (e.clientX - canvas.getBoundingClientRect().left) / canvas.clientWidth * 2 - 1;
            pointer.y = -((e.clientY - canvas.getBoundingClientRect().top) / canvas.clientHeight) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            if (!petModel) return;
            const hit = raycaster.intersectObject(petModel, true);

        // ---------- 场景内聊天（复用 /get_gpt_response） ----------
        const chatMsgs = document.getElementById('chat-msgs');

        const chatSend = document.getElementById('chat-send');
        let chatBusy = false;
        let denHistory = [];   // 场景内聊天多轮记忆（逐宠，切换即清空）
        function appendMsg(role, text) {
            const d = document.createElement('div');
            d.className = 'm ' + (role === 'user' ? 'user' : 'pet');
            d.innerHTML = `<div class="who">${role === 'user' ? '我' : SPECS[currentPetId].name}</div>${String(text).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}`;

        document.getElementById('chat-form').addEventListener('submit', async (e) => {

            chatInput.value = '';
            appendMsg('user', text);
            setAnim('talk', 8000);
            try {
                const resp = await fetch('/get_gpt_response', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, chatHistory: denHistory.slice(-10), model: MODELS[0], petId: currentPetId }),

                const data = await resp.json();
                if (data.reply) {

                    denHistory.push({ role: 'user', content: text }, { role: 'assistant', content: data.reply });
                    if (denHistory.length > 20) denHistory.splice(0, denHistory.length - 20);
                    setAnim('talk', 1200 + Math.min(data.reply.length * 40, 3000));
                    speak(data.reply, { talk: false });   // 念出回复（talk 动画已设）
                    // 情绪联动：根据回复关键词触发动画与粒子
                    if (/汪汪|哈哈|嘿嘿|开心|高兴|好玩|！！|球/.test(data.reply)) { setAnim('happy', 1600); burst('star', 4); }
                    else if (/喜欢|爱|抱抱|摸摸|亲亲|想你/.test(data.reply)) { setAnim('petting', 1500); burst('heart', 5); }
                    addIntimacy(3);
                } else {
                    appendMsg('pet', '（耳朵耷拉…好像没听清，再试一次？）');
                }
            } catch (err) {

        // ---------- UI 绑定 ----------
        function renderPetChips() {

        const bgm = new Audio("{{ url_for('static', filename='mp3/m2.mp3') }}");

        // 某些浏览器需要先 resume AudioContext
        function unlockAudio() {

        // ---------- 心理治愈 · 心情打卡（记录 + 连续陪伴天数 + 宠物语音安抚） ----------
        const MOOD_KEY = 'denMood';
        const MOOD_EMOJI = { happy: '😊', calm: '🙂', low: '😔', anxious: '😰', sad: '😢' };
        function loadMood() {
            try { return JSON.parse(localStorage.getItem(MOOD_KEY) || '{}'); } catch (e) { return {}; }
        }
        function saveMood(m) {
            try { localStorage.setItem(MOOD_KEY, JSON.stringify(m)); }
            catch (e) { toast('心情记录暂时存不下来（存储受限）', 'error'); }
        }
        const moodMask = document.getElementById('mood-mask');
        let moodSel = null;
        function moodDateStr(offset = 0) {
            const d = new Date(); d.setDate(d.getDate() - offset);
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }
        function renderMoodWeek() {
            const m = loadMood();
            const box = document.getElementById('mood-week');
            const wk = ['日', '一', '二', '三', '四', '五', '六'];

        document.getElementById('mood-ok').addEventListener('click', async function () {

        // ---------- 心理治愈 · 跟它一起深呼吸（4-4-6 节律 ×3 轮） ----------
        const breathMask = document.getElementById('breath-mask');
        const breathCircle = document.getElementById('breath-circle');
        const breathText = document.getElementById('breath-text');
        const breathRound = document.getElementById('breath-round');
        let breathTimers = [];
        let breathActive = false;   // 与视觉互动双向互斥：任一启动时另一功能不激活
        function breathClear() { breathTimers.forEach(t => clearTimeout(t)); breathTimers = []; }
        function breathPhase(text, dur, scale, emoji) {
            breathText.textContent = text;
            breathCircle.style.transitionDuration = dur + 's';
            breathCircle.style.transform = `scale(${scale})`;
            breathCircle.textContent = emoji;
        }
        function startBreath() {
            breathClear();   // 防键盘重入：旧链先清
            breathActive = true;
            if (visionOn) {   // 练习期间收起视觉互动，保持沉浸（抚摸动画会打断呼吸同步）
                stopVision();
                const vb = document.getElementById('btn-vision');
                if (vb) vb.textContent = '👁 眼神互动';

            breathMask.hidden = false;
            // 舒缓呼吸坐姿（不借用 sleep 状态——那会侧躺）：独立状态播 idle 慢放
            anim.state = 'breath';
            anim.until = performance.now() + 48000;
            anim.lastInteract = performance.now();
            playAction('idle', 0.42);
            const ROUNDS = 3;
            for (let r = 0; r < ROUNDS; r++) {
                breathTimers.push(setTimeout(() => {
                    breathRound.textContent = `第 ${r + 1} / ${ROUNDS} 轮`;
                    breathPhase('跟着它，慢慢吸气…', 4, 1.35, '🐶');
                }, r * 14000));
                breathTimers.push(setTimeout(() => breathPhase('轻轻屏住…', 4, 1.35, '🐾'), r * 14000 + 4000));
                breathTimers.push(setTimeout(() => breathPhase('缓缓呼气，把烦恼吐出去…', 6, 0.62, '💨'), r * 14000 + 8000));
            }
            breathTimers.push(setTimeout(() => {
                breathPhase('完成啦，做得很好', 2, 1, '💛');
                breathRound.textContent = '';
                burst('star', 5);
                setAnim('petting', 2200);
                showBubble('你做得很好，现在有没有轻松一点点？', 3600);
            }, ROUNDS * 14000));
            breathTimers.push(setTimeout(() => { breathClear(); breathActive = false; breathMask.hidden = true; }, ROUNDS * 14000 + 4000));
        }
        function stopBreath() {
            breathClear();
            breathActive = false;
            breathMask.hidden = true;
            breathCircle.style.transitionDuration = '0.6s';
            breathCircle.style.transform = 'scale(1)';
            setAnim('idle', 0);

        // 自然完成回调结束的是遮罩；状态回落由 anim.until 到期统一处理（breath → idle）

            document.getElementById('chat-form').requestSubmit();
        });

        // ---------- 宠物眨眼（同步用户眨眼 + 日常自动眨） ----------
        // 不做贴片（位置难对准且生硬）——用模型自带快速头部动画（HitReact 抖头=眨眼反应）
        // + 头顶小粒子增强反馈
        function petBlink() {
            if (!petModel || anim.state === 'sleep' || anim.state === 'breath') return;
            // 随机左右 HitReact（头部快速偏转抖动，300-400ms，视觉像眨眼反应）
            const key = Math.random() < 0.5 ? 'blinkL' : 'blinkR';
            const a = actions[key];
            if (a) {
                a.reset();
                a.setLoop(THREE.LoopOnce, 1);
                a.clampWhenFinished = false;   // 播完自动回到权重 0
                a.timeScale = 1.6;             // 加快更像快速反应
                if (activeAction && activeAction !== a) a.crossFadeFrom(activeAction, 0.08, false);
                a.play();
                // 不改 activeAction（idle 继续作为基础层，HitReact 是叠加短暂层）
            }
            // 头顶小粒子（微妙的视觉提示）
            burst('star', 1, petHeadPos().add(new THREE.Vector3(0, 0.18, 0)));
        }
        // 日常自动眨眼
        let autoBlinkAt = performance.now() + 2000 + Math.random() * 3000;
        function autoBlinkTick(now) {
            if (now > autoBlinkAt) {
                autoBlinkAt = now + 2500 + Math.random() * 4000;
                petBlink();
            }
        }

        // ---------- 视觉互动（眼神对视 + 伸手抚摸；本地 WASM 推理，画面不上传） ----------
        let dv = null, visionOn = false, visionTick = null;
        let gazeNow = false, gazeSec = 0, lastGazeHeart = 0;
        let grabbed = false, dropping = false, grabHomeY = 0.02, bounceBack = 0;
        let handTouch = false, handSec = 0, lastHandHeart = 0, lastHandBubble = 0;
        const GAZE_DAILY_CAP = 5, HAND_DAILY_CAP = 10;
        // 日上限计数挂在 state.daily 上（与 saveState 同一份数据，避免互相覆盖）；按本地时区日期切片
        function localDateStr() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }
        function dailyLeft(kind, cap) {
            const today = localDateStr();
            if (!state.daily || state.daily.date !== today) { state.daily = { date: today, gaze: 0, hand: 0 }; }
            return Math.max(0, cap - (state.daily[kind] || 0));
        }
        function dailyAdd(kind) {
            dailyLeft(kind, 999);   // 确保结构已初始化
            state.daily[kind] = (state.daily[kind] || 0) + 1;
            saveState();
        }
        function headScreenPos() {
            const v = petHeadPos().clone().project(camera);
            return { x: (v.x * 0.5 + 0.5) * canvas.clientWidth, y: (-v.y * 0.5 + 0.5) * canvas.clientHeight };
        }
        const vStatus = document.getElementById('vision-status');
        const vHandEl = document.getElementById('vision-hand');
        const vBox = document.getElementById('vision-box');
        let vStatusCache = '';
        function visionRenderStatus() {
            const txt = (gazeNow ? '👁 对视中' : '👁 看向别处') + '|' +
                (handTouch ? '🖐 抚摸中' : (dv && dv.handState.present ? '🖐 手已识别' : '🖐 等待伸手'));
            if (txt === vStatusCache) return;
            vStatusCache = txt;
            if (vStatus) vStatus.innerHTML = txt.split('|').map(s => s.includes('中') ? `<b>${s}</b>` : s).join('<br>');
        }
        function stopVision() {
            if (visionTick) { clearInterval(visionTick); visionTick = null; }
            if (dv) dv.stop();
            if (grabbed) { grabbed = false; dropping = true; }   // 停视觉时松手
            visionOn = false; gazeNow = false; handTouch = false; gazeSec = 0; handSec = 0;
            vBox.classList.add('hidden');
            vHandEl.style.opacity = '0';
        }
        document.getElementById('btn-vision').addEventListener('click', async function () {
            if (visionOn) { stopVision(); this.textContent = '👁 眼神互动'; return; }
            if (!window.DenVision) { toast('视觉模块加载失败，请刷新页面', 'error'); return; }
            this.disabled = true; this.textContent = '⏳ 开启中…';
            dv = dv || new window.DenVision();
            window.__denVision = dv;   // 调试/验收钩子
            // 第三个参数 = 主画布：虚拟手与触摸判定的坐标换算基准（勿传预览小窗）
            const ok = await dv.start(document.getElementById('vision-cam'), {
                onBlink() {
                    petBlink();   // 用户眨眼 → 宠物同步眨
                },
                onSnap() {
                    // 打响指 → 宠物被惊到：跳起 + 星星 + 气泡 + 短暂缩一下
                    if (!petModel || grabbed) return;
                    setAnim('happy', 900);
                    burst('star', 5);
                    showBubble(`${SPECS[currentPetId].name}被吓了一跳！什么声音？！`, 2000);
                    // 被吓缩一下（tick 里的恢复代码会自动恢复）
                    if (petModel.scale.x > 0.7) {
                        petModel.scale.setScalar(petModel.scale.x * 0.82);
                    }
                },
                onGrab(pinching, pos) {
                    if (pinching && pos) {
                        // 捏住：缩小悬挂在手位置，挣扎动画
                        if (!grabbed && petModel) {
                            grabbed = true;
                            grabHomeY = petModel.position.y;
                            playAction('happy', 1.4);   // 快速挣扎（跳跃动画加速）
                            showBubble(`${SPECS[currentPetId].name}被拎起来了！放开我啦～`, 1800);
                            burst('star', 3);
                        }
                    } else if (grabbed) {
                        // 松手：掉落回地面
                        grabbed = false;
                        dropping = true;   // tick 里重力下落
                        showBubble(`吓死我了…不要突然放手啦！`, 2200);
                        if (dailyLeft('hand', HAND_DAILY_CAP) > 0) { dailyAdd('hand'); addIntimacy(1); }
                    }
                },
                onGaze(on) {
                    gazeNow = on;
                    if (on) {
                        gazeSec = 0;
                        showBubble(`${SPECS[currentPetId].name}也正在看着你呢～`, 2200);
                        setAnim('happy', 900);
                    }
                    visionRenderStatus();
                },
                onHand(h) {
                    if (h.present) {
                        const size = 34 + Math.min(h.palm, 0.55) * 95;
                        vHandEl.style.opacity = h.reaching ? '0.95' : '0.35';
                        vHandEl.style.fontSize = (h.reaching ? size : size * 0.7) + 'px';
                        vHandEl.classList.toggle('reaching', !!h.reaching);
                        vHandEl.style.transform = `translate(${h.sx - size / 2}px, ${h.sy - size / 2}px) rotate(${h.reaching ? -14 : 0}deg)`;
                    } else {
                        vHandEl.style.opacity = '0';
                    }
                    // 触摸判定：伸手 且 虚拟手落在宠物头部附近（捏住时不算抚摸）
                    let nowTouch = false;
                    if (h.present && h.reaching && petModel && !grabbed) {
                        const hp = headScreenPos();
                        nowTouch = Math.hypot(h.sx - hp.x, h.sy - hp.y) < 110;
                    }
                    if (nowTouch !== handTouch) {
                        handTouch = nowTouch;
                        if (nowTouch) {
                            handSec = 0; lastHandBubble = performance.now();
                            showBubble(`${SPECS[currentPetId].name}享受你的抚摸～`, 2200);
                        }
                    }
                    visionRenderStatus();
                },
                onError(kind) {
                    toast(kind === 'camera' ? '无法访问摄像头：请在浏览器地址栏允许摄像头权限'
                        : kind === 'runtime' ? '视觉推理异常，已自动停止'
                        : '视觉模型加载失败', 'error');
                    // runtime 自停后同步复位页面 UI（按钮/预览窗/虚拟手）
                    if (kind === 'runtime') {
                        stopVision();
                        const b = document.getElementById('btn-vision');
                        if (b) b.textContent = '👁 眼神互动';
                    }
                },
            }, canvas);
            this.disabled = false;
            if (!ok) { this.textContent = '👁 眼神互动'; dv = null; window.__denVision = null; return; }
            if (breathActive) { dv.stop(); dv = null; window.__denVision = null; this.textContent = '👁 眼神互动'; toast('先专注呼吸，练完再开启眼神互动吧', 'info'); return; }
            visionOn = true;
            this.textContent = '👁 关闭视觉';
            vBox.classList.remove('hidden');
            visionRenderStatus();
            // 低频节拍：对视/抚摸的亲密度累计与粒子节流
            visionTick = setInterval(() => {
                const now = performance.now();
                if (gazeNow) {
                    gazeSec += 0.5;
                    if (now - lastGazeHeart > 4200) { lastGazeHeart = now; burst('heart', 1, petHeadPos().add(new THREE.Vector3(0, 0.25, 0))); }
                    if (gazeSec >= 20) {
                        gazeSec = 0;
                        if (dailyLeft('gaze', GAZE_DAILY_CAP) > 0) { dailyAdd('gaze'); addIntimacy(1); showBubble('对视让感情更深了 +1', 1600); }
                        else showBubble('今天的眼神互动已经够多啦～', 1600);
                    }
                } else gazeSec = 0;
                if (handTouch) {
                    handSec += 0.5;
                    setAnim('petting', 600);
                    if (now - lastHandHeart > 1000) { lastHandHeart = now; burst('heart', 1, petHeadPos().add(new THREE.Vector3(0, 0.2, 0))); }
                    if (now - lastHandBubble > 7000) { lastHandBubble = now; showBubble(`${SPECS[currentPetId].name}轻轻蹭着你的手…`, 1800); }
                    if (handSec >= 2.5) {
                        handSec = 0;
                        if (dailyLeft('hand', HAND_DAILY_CAP) > 0) { dailyAdd('hand'); addIntimacy(1); }
                    }
                } else handSec = 0;
            }, 500);
        });
        window.addEventListener('pagehide', () => { if (visionOn) stopVision(); });
        // 切到其他标签页立即停摄像头（隐私指示灯不该常亮）
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                if (window.speechSynthesis) speechSynthesis.cancel();   // 切页停止朗读
                if (visionOn) {
                    stopVision();
                    const b = document.getElementById('btn-vision');
                    if (b) b.textContent = '👁 眼神互动';
                }
            }
        });

        // ---------- 主循环 ----------
        const clock = new THREE.Clock();
        let timeOfDayChecked = 0;
        function tick() {
            requestAnimationFrame(tick);
            const dt = Math.min(clock.getDelta(), 0.05);
            const t = clock.elapsedTime;
            const now = performance.now();

            if (now - timeOfDayChecked > 60000) { applyTimeOfDay(); timeOfDayChecked = now; }
            autoBlinkTick(now);

            if (petModel) {
                // 保底：被捏住但视觉互动已停（切页/关闭/异常）→ 强制释放掉落
                if (grabbed && (!dv || !dv.running)) {
                    grabbed = false;
                    dropping = true;
                }

                // 捏住跟随：缩小 + 挂在虚拟手前方（用视觉互动的手坐标）
                if (grabbed && petModel) {
                    const hs = dv ? dv.handState : null;
                    if (hs && hs.present) {
                        // 屏幕坐标 → 3D（反投影）
                        const ndcX = (hs.sx / canvas.clientWidth) * 2 - 1;
                        const ndcY = -(hs.sy / canvas.clientHeight) * 2 + 1;
                        const vec = new THREE.Vector3(ndcX, ndcY, 0.5).unproject(camera);
                        const dir = vec.sub(camera.position).normalize();
                        const dy = 1.3 - camera.position.y;
                        const dist = dy / (dir.y || 0.1);
                        const target = camera.position.clone().add(dir.multiplyScalar(Math.abs(dist)));
                        // 平滑跟随 + 悬空晃动
                        const wob = Math.sin(performance.now() * 0.006) * 0.06;
                        petModel.position.lerp(new THREE.Vector3(target.x, 1.3 + wob, target.z), 0.15);
                    }
                    // 缩小（渐变到 0.45）
                    const ts = 0.45;
                    if (petModel.scale.x > ts) petModel.scale.setScalar(Math.max(ts, petModel.scale.x - dt * 3));
                    petModel.rotation.y += 0.025;   // 被拎着缓慢转
                }

                // 掉落回地面（松手后）
                if (dropping && petModel) {
                    petModel.position.y -= 6.5 * dt;   // 重力
                    petModel.rotation.y *= 0.95;
                    if (petModel.position.y <= 0.05) {  // 用固定地面高度，不依赖 grabHomeY
                        petModel.position.y = 0.02;
                        dropping = false;
                        bounceBack = 0.12;
                        setAnim('idle', 0);
                    }
                }
                // 弹跳衰减
                if (bounceBack > 0 && petModel && !dropping && !grabbed) {
                    bounceBack -= dt * 0.5;
                    petModel.position.y = grabHomeY + Math.max(0, bounceBack) * Math.sin(bounceBack * 30);
                    if (bounceBack <= 0) petModel.position.y = grabHomeY;
                }
                // 捏住时恢复正常大小（松手后渐回）
                if (!grabbed && !dropping && petModel && petModel.scale.x < 0.95) {
                    petModel.scale.setScalar(Math.min(1, petModel.scale.x + dt * 2));
                }

                // 出生缩放（弹性放大）
                if (anim.birth !== undefined && anim.birth < 1) {
                    anim.birth = Math.min(1, anim.birth + dt * 2.2);
                    petModel.scale.setScalar(anim.birth < 1
                        ? (1 - Math.pow(1 - anim.birth, 3)) * (1 + Math.sin(anim.birth * Math.PI) * 0.12) : 1);
                }

                // 状态到期回落 + 长时间无互动入睡（动画切换交给 setAnim）
                if (anim.until && now > anim.until) { setAnim('idle', 0); anim.until = 0; }
                else if (anim.state === 'idle' && now - anim.lastInteract > 45000) {
                    anim.state = 'sleep'; anim.sleptAt = now; playSleep();   // 不经 setAnim（它会刷新互动时间）
                } else if (anim.state === 'sleep' && anim.lastInteract > (anim.sleptAt || 0)) {
                    anim.state = 'idle'; playAction('idle', 1);   // 入睡后发生过新互动才唤醒（crossFade 翻身站起）
                }
                if (mixer) mixer.update(dt);
                const st = anim.state;

                // 睡觉 Zzz
                if (st === 'sleep' && Math.random() < 0.006) burst('zzz', 1, petHeadPos().add(new THREE.Vector3(0.25, 0.15, 0)));
                // 气泡跟随：拖拽/缩放相机时实时贴住宠物头部投影
                if (bubbleEl && bubbleEl.classList.contains('show')) {
                    const hp = petHeadPos().clone().project(camera);
                    bubbleEl.style.left = `${(hp.x * 0.5 + 0.5) * canvas.clientWidth + 16}px`;
                    bubbleEl.style.top = `${(-hp.y * 0.5 + 0.5) * canvas.clientHeight - 70}px`;
                }
            }

            // 主题环境粒子（樱花飘落/落雪/微尘上浮）与篝火闪烁
            for (const sp of envSprites) {
                sp.position.y += sp.userData.v * dt;
                sp.userData.sway += dt * 1.2;
                sp.position.x += Math.sin(sp.userData.sway) * dt * 0.18;
                if (sp.userData.rise) {
                    if (sp.position.y > 3.2) { sp.position.y = 0.1; sp.position.x = (Math.random() - 0.5) * 7; sp.position.z = (Math.random() - 0.5) * 7; }
                } else if (sp.position.y < 0.05) {
                    sp.position.y = 2.8 + Math.random() * 0.6; sp.position.x = (Math.random() - 0.5) * 7; sp.position.z = (Math.random() - 0.5) * 7;
                }
            }
            if (themeFireLight) themeFireLight.intensity = 0.85 + Math.sin(t * 9) * 0.15 + Math.sin(t * 23) * 0.1;
            if (themeFlame) themeFlame.scale.setScalar(1 + Math.sin(t * 11) * 0.12);

            // 粒子物理
            for (let i = particles.length - 1; i >= 0; i--) {
                const sp = particles[i];
                sp.userData.life -= dt;
                sp.userData.v.y -= 1.6 * dt;
                sp.position.addScaledVector(sp.userData.v, dt);
                sp.material.opacity = Math.max(0, sp.userData.life);
                if (sp.userData.life <= 0) { scene.remove(sp); sp.material.dispose(); particles.splice(i, 1); }
            }
            // 食物飞行
            if (flyingFood) {
                flyingFood.t += dt * 1.8;
                const k = Math.min(1, flyingFood.t);
                flyingFood.sprite.position.lerpVectors(flyingFood.from, flyingFood.to, k);
                flyingFood.sprite.position.y += Math.sin(k * Math.PI) * 0.9;
                if (k >= 1) { scene.remove(flyingFood.sprite); flyingFood = null; }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        function resize() {
            const w = canvas.clientWidth, h = canvas.clientHeight;
            if (canvas.width !== w * renderer.getPixelRatio()) {
                renderer.setSize(w, h, false);
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
            }
        }
        canvas.clientWidth; // init
        window.addEventListener('resize', resize);

        // ---------- 启动 ----------
        applyTimeOfDay();
        spawnPet(currentPetId);
        appendMsg('pet', SPECS[currentPetId].greet + ' 点点下面的按钮，或者直接点我！');
        resize();
        tick();
        new ResizeObserver(resize).observe(canvas);
        // 调试/测试钩子
        window.__den = {
            get scene() { return scene; },
            get petModel() { return petModel; },
            get mixer() { return mixer; },
            SPECS, spawnPet, setAnim, speak, petBlink, camera: () => camera,
            get grabbed() { return grabbed; }, get dropping() { return dropping; },
        };
    })();
    </script>
</body>
</html>
