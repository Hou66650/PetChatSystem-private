<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · MPC 宠物聊天</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <style>
        body.theme {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--c-bg) var(--auth-bg-url, url("{{ url_for('static', filename='images/c.jpg') }}")) center / cover no-repeat;
        }
        body.theme::before {
            content: '';
            position: fixed; inset: 0;
            backdrop-filter: saturate(.65) brightness(1.05);
            -webkit-backdrop-filter: saturate(.65) brightness(1.05);
            background: rgba(255, 248, 240, .58);
        }
        .login-card {
            position: relative;
            width: min(92vw, 360px);
            background: var(--c-card);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-hover);
            padding: 32px 28px;
        }
        .login-card h2 {
            margin: 0 0 24px;
            font-family: var(--font-round);
            text-align: center;
            font-size: 22px;
        }
        .form-tip { font-size: 13px; color: var(--c-danger); min-height: 20px; margin: 4px 0 8px; text-align: center; }
        .login-links { display: flex; justify-content: space-between; margin-top: 16px; font-size: 14px; }
    </style>
</head>
<body class="theme">
    {% include '_navbar.html' %}
    <div class="login-card">
        <h2>🐾 欢迎回来</h2>
        <form method="post" action="" novalidate>
            <div class="form-tip">{{ error or '' }}</div>
            <div class="field">
                <label for="username">用户名</label>
                <input class="input" type="text" id="username" name="username" size="30"
                       value="{{ request.form.username }}" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="password">密码</label>
                <input class="input" type="password" id="password" name="password" size="30"
                       autocomplete="current-password" required>
            </div>
            <button class="btn" type="submit" style="width: 100%;">登录</button>
        </form>
        <div class="login-links">
            <a href="{{ url_for('main.index') }}">← 返回首页</a>
            <a href="{{ url_for('auth.register') }}">注册新账号</a>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script src="{{ url_for('static', filename='js/auth-background.js') }}"></script>
</body>
</html>
