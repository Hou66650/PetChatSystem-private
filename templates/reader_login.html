<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" type="image/png" href="/static/images/pait-island-icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>登录 · 派特岛</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="/static/css/auth-island.css?v={{ app_version }}">
</head>
<body class="theme auth-island">
    <div class="auth-landscape" aria-hidden="true"></div><div class="auth-mist" aria-hidden="true"></div>
    <header class="auth-top"><a class="auth-brand" href="/"><img src="/static/images/pait-island-icon.png" alt="">派特岛</a><a class="auth-back" href="/">探索云端群岛 ↗</a></header>
    <main class="auth-layout"><section class="auth-story"><span class="auth-eyebrow">PAIT ISLAND · 心有栖所</span><h1>越过云海，<br>有人等你回来。</h1><p>把世界的喧嚣留在远方。<br>在这座小岛，与你的伙伴慢慢相识。</p><div class="auth-orbit"></div><p class="auth-caption">月光 · 云海 · 一份温柔的陪伴</p></section>
    <div class="auth-card">
        <span class="auth-eyebrow">WELCOME HOME</span><h2>欢迎回到派特岛</h2><p class="auth-subtitle">你的伙伴，正在云海另一端等你。</p>
        <form method="post" action="" novalidate>
            <div class="form-tip" role="alert">{{ error or '' }}</div>
            <div class="field">
                <label for="username">用户名</label>
                <input class="input" type="text" id="username" name="username" size="30"
                       value="{{ request.form.username }}" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="password">密码</label>
                <input class="input" type="password" id="password" name="password" size="30"
                       autocomplete="current-password" required>
            </div>
            <button class="btn" type="submit" style="width: 100%;">登录</button>
        </form>
        <div class="login-links">
            <a href="{{ url_for('main.index') }}">← 返回首页</a>
            <a href="{{ url_for('auth.register') }}">注册新账号</a>
        </div>
    </div>
    </main>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>
</html>
