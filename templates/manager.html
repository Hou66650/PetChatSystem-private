<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/static/images/pait-star-ring-icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>功能导航 - 黑暗森林</title>
    <style>
        /* 基础样式 */
        body {
            font-family: 'Roboto', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #3f0a78, #750daf, #8855a6); /* 黑暗森林渐变背景 */
            color: #e0e0e0; /* 高对比的浅灰色字体 */
            margin: 0;
            padding: 0;
        }

        .page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* 导航栏样式 */
        .nav-container {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 1rem 2rem;
            background-color: rgba(15, 32, 39, 0.9); /* 半透明黑暗背景 */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-link {
            color: #750daf; /* 霓虹蓝色 */
            font-size: 16px;
            margin-left: 1.5rem;
            text-decoration: none;
            transition: color 0.3s ease, transform 0.3s ease;
            padding: 0.5rem 1rem;
            border-radius: 5px;
        }

        .nav-link:hover {
            color: #8065f6; /* 霓虹橙色 */
            transform: scale(1.1);
        }

        /* 欢迎容器 */
        .welcome-container {
            text-align: center;
            margin-top: 3rem;
            animation: fadeIn 1s ease;
        }

        .welcome-container h2 {
            font-size: 3rem;
            color: #393bae; /* 霓虹橙色 */
            text-shadow: 0 0 10px #f6d365, 0 0 20px #f6d365;
            margin-bottom: 1rem;
        }

        .welcome-container p {
            font-size: 1.5rem;
            color: #e0e0e0;
            margin-bottom: 2rem;
        }

        /* 功能卡片 */
        .features {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 2rem;
        }

        .feature {
            background: rgba(32, 58, 67, 0.8); /* 半透明深色背景 */
            border-radius: 15px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3), 0 0 15px rgba(0, 198, 255, 0.5); /* 霓虹边框 */
            padding: 2rem;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .feature:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5), 0 0 25px rgba(0, 198, 255, 0.8);
        }

        .feature img {
            width: 240px;
            height: 200px;
            margin-bottom: 1rem;
            border-radius: 50%;
            border: 3px solid rgba(0, 198, 255, 0.8); /* 霓虹边框 */
        }

        .feature h3 {
            font-size: 1.8rem;
            color: #00c6ff; /* 霓虹蓝色 */
            margin-bottom: 0.5rem;
            text-shadow: 0 0 10px #00c6ff, 0 0 20px #00c6ff;
        }

        .feature p {
            color: #e0e0e0;
        }

        /* 页脚样式 */
        .footer {
            background-color: rgba(15, 32, 39, 0.9);
            text-align: center;
            padding: 1rem 0;
            margin-top: 3rem;
            box-shadow: 0 -4px 6px rgba(0, 0, 0, 0.3);
        }

        .footer p {
            color: #e0e0e0;
            font-size: 14px;
        }

        /* 动画效果 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body class="theme">
    {% include '_navbar.html' %}
    <!-- 导航栏 -->
    <div class="nav-container">
        <a href="{{ url_for('main.logout') }}" class="nav-link">注销 [{{ g.user }}]</a>
        <a href="{{ url_for('manager.manager_users') }}" class="nav-link">用户管理</a>
    </div>

    <!-- 页面内容 -->
    <div class="page">
        <!-- 欢迎部分 -->
        <div class="welcome-container">
            <h2>欢迎来到用户管理界面</h2>
            <p>探索未知，掌控一切。</p>
        </div>

        <!-- 功能模块 -->
        <div class="features">
            <!-- 用户管理功能 -->
            <div class="feature" onclick="window.location.href='manager/users';">
                <img src="{{ url_for('static', filename='images/2.jpg') }}" alt="用户管理">
                <h3>用户管理</h3>
                <p>添加、编辑和删除用户信息。</p>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <div class="footer">
        <p>&copy; 2025 用户管理系统</p>
    </div>
</body>
</html>
