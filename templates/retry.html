 <!DOCTYPE html>
    <html lang="en">
    <head>
    <link rel="icon" type="image/png" href="/static/images/pait-app-icon-f4.png">

        <title>GPT Chat</title>
        <link rel="stylesheet" href="css/style.css">
        <style>
            body {
                font-family: Arial, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
                margin: 0;
                /*background-image: url('images/sakura1.jpg'); !* 替换为你的樱花背景图片路径 *!*/
                /*background-size: cover; !* 使背景图片覆盖整个页面 *!*/
                /*background-position: center; !* 将背景图片居中 *!*/
                /*background-repeat: no-repeat; !* 防止背景图片重复 *!*/
            }
             .avatar-img {
                display: inline-block;
                width: 40px;
                height: 40px;
                border-radius: 50%;
                margin-right: 10px;
                vertical-align: middle; /* 垂直居中对齐 */
            }

            .chat-container {
                width: 80%;
                max-width: 1000px;
                border: 1px solid #ccc;
                border-radius: 5px;
                overflow: hidden;
            }
            .chat-header {
                background-color: #3a0577;
                color: white;
                padding: 10px;
                text-align: center;
            }
            .chat-body {
                padding: 10px;
                height: 500px;
                overflow-y: scroll;
            }
            .chat-footer_{
                display: flex;
                flex-direction: row;
                align-items: center;
                padding: 10px;
                background-color: #f4f4f4;


            }
            .another-component{
                display: flex;
                flex-direction: row;
                align-items: center;
                padding: 10px;
                background-color: #f4f4f4;
            }
            .chat-footer {
                display: flex;
                flex-direction: row;
                align-items: center;
                padding: 10px;
                background-color: #f4f4f4;
            }
            .message-input {
                flex: 1;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 5px;
                margin-right: 10px;
            }
            .submit-button {
                padding: 10px 20px;
                background-color: #3a0577;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
            }
            .user-name-input{
                flex:1;
                padding:10px;
                border: 1px solid #ccc;
                border-radius: 5px;
                margin-right: 10px;
            }
            .user-name-btn{
                padding: 10px 20px;
                background-color: #750daf;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
            }
            .assistant-name-input{
                flex:1;
                padding:10px;
                border: 1px solid #ccc;
                border-radius: 5px;
                margin-right: 10px;
            }
            .model-select {
                margin-right: 10px;
            }
            .timer{
                 font-family: 'Comic Sans MS', cursive, sans-serif; /* 使用 Comic Sans MS 字体 */
                font-size: 12px; /* 字体大小 */
                color: #750daf; /* 粉色 */
                font-weight: bold; /* 加粗 */
                padding: 2px 4px; /* 内边距 */
                border-radius: 4px; /* 圆角 */
                background-color: #FFFACD; /* 浅黄色背景 */
                display: inline-block; /* 使其成为内联块元素 */
            }
            .clear-memory-btn{
                padding: 10px 20px;
                background-color: #6e076b;
                margin-right:200px;
                margin-left:200px;
                color: white;
                border: none;
                border-radius: 2px;
                cursor: pointer;
            }
            .chat-message p {
                display: inline-block;
                vertical-align: middle;
            }

             .blurred-button {
                position: fixed;
                top: 50%;
                transform: translateY(-50%);
                padding: 20px;
                background-color: rgba(255, 255, 255, 0.3);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                border: none;
                cursor: pointer;
                z-index: 10;
            }

           .left-button {
                left: 20px;
            }

           .right-button {
                right: 20px;
            }

           /* 美化按钮样式 */
        .save-pdf-button {
          background-color: #007BFF;
          color: white;
          padding: 12px 24px;
          border: none;
          border-radius: 4px;
          cursor: pointer;
          font-size: 16px;
          transition: background-color 0.3s ease;
        }

        .save-pdf-button:hover {
          background-color: #0056b3;
        }

        /* 模拟要保存的内容样式 */
        #content-to-save {
          margin-top: 20px;
          padding: 20px;
          border: 1px solid #ccc;
        }
        </style>
    <!-- 引入 html2canvas 和 jspdf 库 -->
      <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

 <body>
       <!-- 添加保存为 PDF 的按钮 -->
    <button class="save-pdf-button" id="save-pdf-btn">保存聊天记录为 PDF</button>
       <!-- 模拟要保存的内容 -->

        <button class="blurred-button left-button">左切换</button>
        <button class="blurred-button right-button">右切换</button>


        <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
        <script src="js/script.js"></script>
        <div class="chat-container">
            <div class="chat-header">
                <h1>GPT Chat</h1>
            </div>
            <div class="chat-body" id="chat-body">
                <!-- Messages will be displayed here -->
            </div>
            <div class="chat-footer_">
                <div class="user-name">
                    <input type="text" class="user-name-input" id="user-name" placeholder="input your name what you want">
                    <button class="user-name-btn" id="user-btn">sure</button>
                </div>
                <div class="assistant-name">
                    <input type="text" class="assistant-name-input" id="assistant-name" placeholder="rename your assistant">
                    <button class="user-name-btn" id="assistant-btn">sure</button>

                </div>
            </div>
            <div class="another-component">
                <div class="clear-memory">
                    <button class="clear-memory-btn" id="clear-mer-btn">Clear Memory</button>
                </div>

            </div>
            <div class="chat-footer">
                <select class="model-select" id="model-pattern">
                    <option value="gpt-4o">gpt-4o</option>
                    <option value="gpt-4o-mini">gpt-4o-mini</option>
                    <option value="gpt-4-gizmo-*">gpt-4-gizmo-*</option>
                    <!-- Add more models as needed -->
                </select>
                <input type="text" class="message-input" id="user-message" placeholder="Type your message here">
                <button class="submit-button" id="submit-message">Send</button>

            </div>
        </div>
 <script>
     function getCurrentTime() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        return `${hours}:${minutes}:${seconds}`;
    }
 </script>
