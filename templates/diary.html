<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的日记 · MPC 宠物聊天</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <style>
        body.theme {
            padding-top: var(--nav-h);
            min-height: 100vh;
            /* 保留原书房/纸张背景（设计文档 二.8：背景图不改） */
            background: var(--c-bg) url("/images/study-room.jpg") no-repeat center center fixed;
            background-size: cover;
            font-family: var(--font-body);
        }
        .diary-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
        }
        .diary-head {
            width: min(1000px, 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            color: var(--c-text);
            text-shadow: 0 1px 0 rgba(255,255,255,.6);
        }
        .diary-head h2 { margin: 0; font-family: var(--font-round); font-size: 20px; }
        .paper {
            position: relative;
            width: min(1000px, 100%);
            min-height: 60vh;
            background: url("/images/paper.png") no-repeat center center;
            background-size: 100% 100%;
            padding: clamp(24px, 5vw, 64px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, .3);
            border-radius: 12px;
            overflow-y: auto;
            max-height: 75vh;
        }
        /* 纸张自带横线纹理会"穿字"：垫一层半透明白底，纹理保留但退到文字后 */
        .paper::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 253, 248, .82);
            border-radius: 12px;
        }
        .diary-content {
            position: relative;
            font-size: 15px;
            line-height: 1.8;
            color: #3c342c;
            max-width: 720px;
            margin: 0 auto;
        }
        .diary-content .entry {
            margin: 0 0 14px;
        }
        .diary-content .entry strong { color: #2f2620; }
        .diary-empty {
            text-align: center;
            color: var(--c-text-sub);
            padding: 48px 16px;
        }
        .diary-empty .btn { margin-top: 16px; }
    </style>
</head>
<body class="theme">
    {% include '_navbar.html' %}
    <div class="diary-wrap">
        <div class="diary-head">
            <h2>📖 我的聊天日记</h2>
            <div style="display:flex; gap:8px; align-items:center;">
                <span id="diary-date" class="text-sub" style="font-size:13px;"></span>
                <button class="btn-outline btn-sm" id="btn-export-pdf">导出 PDF</button>
                <button class="btn btn-sm" onclick="location.href='/gpt'">继续聊天</button>
            </div>
        </div>
        <div class="paper">
            <div id="diary-content" class="diary-content">正在加载日记内容…</div>
        </div>
    </div>
    {% include '_footer.html' %}
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script src="{{ url_for('static', filename='js/vendor/html2canvas.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/vendor/jspdf.umd.min.js') }}"></script>
    <script>
    // 日期标题
    (function () {
        const d = new Date();
        const pad = n => String(n).padStart(2, '0');
        document.getElementById('diary-date').textContent =
            `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    })();

    // 加载日记（localStorage 与聊天页同源：chatHistory）
    async function loadDiary() {
        const el = document.getElementById('diary-content');
        let chatHistory = [];
        try {
            chatHistory = JSON.parse(localStorage.getItem('chatHistory') || '[]');
        } catch (e) { chatHistory = []; }

        if (!chatHistory.length) {
            el.innerHTML = '';
            const empty = document.createElement('div');
            empty.className = 'diary-empty';
            empty.innerHTML = `还没有聊天记录。<br>去和宠物聊两句，再回来翻开这页日记吧。
                <div><button class="btn" onclick="location.href='/gpt'">开始聊天</button></div>`;
            el.appendChild(empty);
            return;
        }
        // 统一渲染：用户=「我」，宠物用其名；空消息过滤；条目等距
        const entries = chatHistory
            .filter(e => e && e.message && String(e.message).trim())
            .map(e => {
                const name = e.role === 'user'
                    ? '我'
                    : (e.sender || '宠物');
                const div = document.createElement('p');
                div.className = 'entry';
                const strong = document.createElement('strong');
                strong.textContent = name + (e.ts ? `（${e.ts}）` : '') + '：';
                div.appendChild(strong);
                div.appendChild(document.createTextNode(String(e.message).trim()));
                return div;
            });
        el.innerHTML = '';
        entries.forEach(d => el.appendChild(d));
    }
    loadDiary();

    // 导出 PDF（复用聊天页导出逻辑，本地化依赖）
    document.getElementById('btn-export-pdf').addEventListener('click', function () {
        const paper = document.querySelector('.paper');
        toast('正在生成 PDF…', 'info');
        html2canvas(paper).then(canvas => {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            const pdfW = pdf.internal.pageSize.getWidth();
            const pdfH = pdf.internal.pageSize.getHeight();
            const imgH = canvas.height * pdfW / canvas.width;
            let y = 0;
            while (y < canvas.height) {
                const pageH = Math.min(canvas.height - y, pdfH * canvas.width / pdfW);
                const pc = document.createElement('canvas');
                pc.width = canvas.width; pc.height = pageH;
                pc.getContext('2d').drawImage(canvas, 0, y, canvas.width, pageH, 0, 0, canvas.width, pageH);
                pdf.addImage(pc.toDataURL('image/png'), 'PNG', 0, 0, pdfW, imgH);
                y += pageH;
                if (y < canvas.height) pdf.addPage();
            }
            pdf.save('my-diary.pdf');
            toast('PDF 已导出', 'success');
        }).catch(() => toast('PDF 生成失败', 'error'));
    });
    </script>
</body>
</html>
