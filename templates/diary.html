<!DOCTYPE html>
<html lang="zh-CN">
<head>
    {% include '_brand_icons.html' %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>宠物日记 · 派特岛</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="/static/css/journal.css?v={{ app_version }}">
    <link rel="stylesheet" href="/static/css/diary.css?v={{ app_version }}">
</head>
<body class="theme journal-theme diary-page">
    {% include '_navbar.html' %}
    <main class="diary-wrap">
        <div class="diary-head">
            <div><p class="journal-eyebrow">写给一起生活的你</p><h1>宠物的每日手记</h1></div>
            <div class="diary-actions">
                <span id="diary-date" class="text-sub" style="font-size:13px;"></span>
                <button class="btn-outline btn-sm" id="btn-export-pdf">导出 PDF</button>
                <button class="btn btn-sm" onclick="location.href='/gpt'">继续聊天</button>
            </div>
        </div>
        <div class="paper">
            <p class="diary-intro">每一天的小小探索、每一次与你相遇，都写在这里。今天的故事还在继续，回来的时候，或许又多了一页心事。</p>
            <div class="diary-toolbar" role="group" aria-label="日记筛选">
                <div class="diary-filter"><label for="f-pet">宠物</label>
                <select id="f-pet">
                    <option value="all">全部</option>
                    <option value="1">球球（柴犬）</option>
                    <option value="2">雪球（哈士奇）</option>
                    <option value="3">团子（猫咪）</option>
                    <option value="4">大壮（德牧）</option>
                </select></div>
                <div class="diary-filter"><label for="f-date">日期</label>
                <select id="f-date">
                    <option value="all">全部日期</option>
                    <option value="7">最近 7 天</option>
                    <option value="30">最近 30 天</option>
                </select></div>
                <div class="diary-filter"><label for="f-kw">关键词</label>
                <input type="search" id="f-kw" placeholder="搜索日记内容…" aria-label="关键词搜索"></div>
                <button type="button" class="btn-link" id="btn-reset-filters">重置筛选</button>
                <span class="diary-count" id="diary-count" aria-live="polite"></span>
            </div>
            <div id="diary-content" class="diary-content">正在加载日记内容…</div>
            <button type="button" class="btn-outline btn-sm" id="btn-load-more" hidden>加载更早的日记</button>
        </div>
    </main>
    {% include '_footer.html' %}
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script src="{{ url_for('static', filename='js/vendor/html2canvas.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/vendor/jspdf.umd.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/diary.js') }}?v={{ app_version }}"></script>

</body>
</html>
