    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <title>GPT Chat</title>
        <link rel="stylesheet" href="css/style.css">
        <style>
            body {
                font-family: Arial, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
                margin: 0;
                /*background-image: url('images/sakura1.jpg'); !* 替换为你的樱花背景图片路径 *!*/
                /*background-size: cover; !* 使背景图片覆盖整个页面 *!*/
                /*background-position: center; !* 将背景图片居中 *!*/
                /*background-repeat: no-repeat; !* 防止背景图片重复 *!*/
            }
             .avatar-img {
                display: inline-block;
                width: 40px;
                height: 40px;
                border-radius: 50%;
                margin-right: 10px;
                vertical-align: middle; /* 垂直居中对齐 */
            }

            .chat-container {
                width: 80%;
                max-width: 1000px;
                border: 1px solid #ccc;
                border-radius: 5px;
                overflow: hidden;
            }
            .chat-header {
                background-color: #3a0577;
                color: white;
                padding: 10px;
                text-align: center;
            }
            .chat-body {
                padding: 10px;
                height: 500px;
                overflow-y: scroll;
            }
            .chat-footer_{
                display: flex;
                flex-direction: row;
                align-items: center;
                padding: 10px;
                background-color: #f4f4f4;


            }
            .another-component{
                display: flex;
                flex-direction: row;
                align-items: center;
                padding: 10px;
                background-color: #f4f4f4;
            }
            .chat-footer {
                display: flex;
                flex-direction: row;
                align-items: center;
                padding: 10px;
                background-color: #f4f4f4;
            }
            .message-input {
                flex: 1;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 5px;
                margin-right: 10px;
            }
            .submit-button {
                padding: 10px 20px;
                background-color: #3a0577;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
            }
            .user-name-input{
                flex:1;
                padding:10px;
                border: 1px solid #ccc;
                border-radius: 5px;
                margin-right: 10px;
            }
            .user-name-btn{
                padding: 10px 20px;
                background-color: #750daf;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
            }
            .assistant-name-input{
                flex:1;
                padding:10px;
                border: 1px solid #ccc;
                border-radius: 5px;
                margin-right: 10px;
            }
            .model-select {
                margin-right: 10px;
            }
            .timer{
                 font-family: 'Comic Sans MS', cursive, sans-serif; /* 使用 Comic Sans MS 字体 */
                font-size: 12px; /* 字体大小 */
                color: #750daf; /* 粉色 */
                font-weight: bold; /* 加粗 */
                padding: 2px 4px; /* 内边距 */
                border-radius: 4px; /* 圆角 */
                background-color: #FFFACD; /* 浅黄色背景 */
                display: inline-block; /* 使其成为内联块元素 */
            }
            .clear-memory-btn{
                padding: 10px 20px;
                background-color: #6e076b;
                margin-right:200px;
                margin-left:200px;
                color: white;
                border: none;
                border-radius: 2px;
                cursor: pointer;
            }
            .chat-message p {
                display: inline-block;
                vertical-align: middle;
            }

             .blurred-button {
                position: fixed;
                top: 50%;
                transform: translateY(-50%);
                padding: 20px;
                background-color: rgba(255, 255, 255, 0.3);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                border: none;
                cursor: pointer;
                z-index: 10;
            }

           .left-button {
                left: 20px;
            }

           .right-button {
                right: 20px;
            }

           /* 美化按钮样式 */
        .save-pdf-button {
          background-color: #007BFF;
          color: white;
          padding: 12px 24px;
          border: none;
          border-radius: 4px;
          cursor: pointer;
          font-size: 16px;
          transition: background-color 0.3s ease;
        }

        .save-pdf-button:hover {
          background-color: #0056b3;
        }

        /* 模拟要保存的内容样式 */
        #content-to-save {
          margin-top: 20px;
          padding: 20px;
          border: 1px solid #ccc;
        }
        </style>
    <!-- 引入 html2canvas 和 jspdf 库 -->
      <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    </head>

    <body>
       <!-- 添加保存为 PDF 的按钮 -->
    <button class="save-pdf-button" id="save-pdf-btn">保存聊天记录为 PDF</button>
       <!-- 模拟要保存的内容 -->

        <button class="blurred-button left-button">左切换</button>
        <button class="blurred-button right-button">右切换</button>


        <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
        <script src="js/script.js"></script>
        <div class="chat-container">
            <div class="chat-header">
                <h1>GPT Chat</h1>
            </div>
            <div class="chat-body" id="chat-body">
                <!-- Messages will be displayed here -->
            </div>
            <div class="chat-footer_">
                <div class="user-name">
                    <input type="text" class="user-name-input" id="user-name" placeholder="input your name what you want">
                    <button class="user-name-btn" id="user-btn">sure</button>
                </div>
                <div class="assistant-name">
                    <input type="text" class="assistant-name-input" id="assistant-name" placeholder="rename your assistant">
                    <button class="user-name-btn" id="assistant-btn">sure</button>

                </div>
            </div>
            <div class="another-component">
                <div class="clear-memory">
                    <button class="clear-memory-btn" id="clear-mer-btn">Clear Memory</button>
                </div>

            </div>
            <div class="chat-footer">
                <select class="model-select" id="model-pattern">
                    <option value="gpt-4o">gpt-4o</option>
                    <option value="gpt-4o-mini">gpt-4o-mini</option>
                    <option value="gpt-4-gizmo-*">gpt-4-gizmo-*</option>
                    <!-- Add more models as needed -->
                </select>
                <input type="text" class="message-input" id="user-message" placeholder="Type your message here">
                <button class="submit-button" id="submit-message">Send</button>

            </div>
        </div>


        <script>

    // 获取当前时间并格式化
    function getCurrentTime() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        return `${hours}:${minutes}:${seconds}`;
    }

    // 在 DOM 加载完成后执行
    document.addEventListener('DOMContentLoaded', () => {
        // 获取 DOM 元素
        const timeDisplay = document.getElementById('timer');
        const chatBody = document.getElementById('chat-body');
        const userMessageInput = document.getElementById('user-message');
        const modelPatternInput = document.getElementById('model-pattern');
        const userNameInput = document.getElementById('user-name');
        const assistantNameInput = document.getElementById('assistant-name');
        const leftButton = document.querySelector('.left-button');
        const rightButton = document.querySelector('.right-button');

        // 背景图片与 JSON 文件列表
        const backgroundImages = ['css/b.jpg', 'css/c.jpg', 'css/d.jpg', 'css/a.jpg'];
        const jsonFiles = [
            'templates\\json\\role_description1.json',
            'templates\\json\\role_description2.json',
            'templates\\json\\role_description3.json',
            'templates\\json\\role_description4.json'
        ];
        let currentImageIndex = 0;
        let currentJsonIndex = 0;




        // 定义更新当前时间的函数
        function updateCurrentTime() {
            if (timeDisplay) {
                timeDisplay.textContent = getCurrentTime();
            }
        }

        // 每分钟更新当前时间
        setInterval(updateCurrentTime, 60000);
        updateCurrentTime();

        // 切换背景图片的函数
        function switchBackground(direction) {
            if (direction === 'left') {
                currentImageIndex = (currentImageIndex - 1 + backgroundImages.length) % backgroundImages.length;
                currentJsonIndex = (currentJsonIndex - 1 + jsonFiles.length) % jsonFiles.length;
            } else {
                currentImageIndex = (currentImageIndex + 1) % backgroundImages.length;
                currentJsonIndex = (currentJsonIndex + 1) % jsonFiles.length;
            }

            // 更新背景图片
            document.body.style.backgroundImage = `url('${backgroundImages[currentImageIndex]}')`;

            // 打印当前 JSON 文件名称
            console.log('当前要使用的 JSON 文件名称为:', jsonFiles[currentJsonIndex]);
        }

        // 根据 role 值动态设置图片路径
        function getAvatarSrc(role) {
            switch (role) {
                case '一只活泼的柯基':
                    return 'images/f.png';
                case '一只可爱的萨摩耶':
                    return 'images/d.png';
                case '一只俏皮的猫咪':
                    return 'images/c.png';
                default:
                    return 'images/b.png';
            }
        }

        // 加载 JSON 文件并更新界面
        function loadJsonFile() {
        let currentFile = jsonFiles[currentJsonIndex].replace('templates\\', '');
        // const currentFile = 'http://127.0.0.1:5000/static/role_description1.json';

            fetch(currentFile)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('网络响应不正常');
                    }
                    return response.json();
                })
                .then(data => {
                    console.log('JSON 文件中的 role 信息:', data.role);
                    console.log('JSON 文件中的 description 信息:', data.description);
                    if (data.error) {
                        chatBody.innerHTML += `<p>Error:${data.error}</p>`;
                    } else {
                        const markdownReply = data.reply.replace(/^(-{3,}|\*{3,}|_{3,})$/gm, '');
                        const htmlResponse = marked.parse(markdownReply);

                        // 根据 role 值设置图片路径
                        const avatarSrc = getAvatarSrc(data.role);

                        chatBody.innerHTML += `
                            <div class="chat-message">
                                <img src="${avatarSrc}" alt="Avatar" class="avatar-img" style="width: 150px; height: 150px;">
                                <p><strong>${assistantNameInput.value}【<span class="timer">${getCurrentTime()}</span>】:</strong> ${htmlResponse}</p>
                            </div>
                        `;
                    }
                })
                .catch(error => {
                    chatBody.innerHTML += `<p><strong>Error:</strong> An error occurred while fetching the JSON file.</p>`;
                    console.error('请求出错:', error);
                });
        }

        // 发送请求到后端
        function sendRequestToBackend(userMessage, chatHistory, modelPattern, jsonFile) {
            fetch('/get_gpt_response', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: userMessage,
                    chatHistory: chatHistory,
                    model_pattern: modelPattern,
                    jsonFile: jsonFile
                })
            })
                .then(response => response.json())
                .then(data => {
                    if (data.reply) {
                        // 将 AI 回复添加到历史记录
                        chatHistory.push({ sender: assistantNameInput.value, message: data.reply });

                        // 保存更新的历史记录
                        localStorage.setItem('chatHistory', JSON.stringify(chatHistory));

                        // 转换 Markdown 为 HTML
                        const markdownReply = data.reply.replace(/^(-{3,}|\*{3,}|_{3,})$/gm, '');
                        const htmlResponse = marked.parse(markdownReply);

                        // 根据 role 值设置图片路径
                        const avatarSrc = getAvatarSrc(data.role);

                        chatBody.innerHTML += `
                            <div class="chat-message">
                                <img src="${avatarSrc}" alt="Avatar" class="avatar-img" style="width: 150px; height: 150px;">
                                <p><strong>${assistantNameInput.value}【<span class="timer">${getCurrentTime()}</span>】:</strong> ${htmlResponse}</p>
                            </div>
                        `;
                    } else if (data.error) {
                        chatBody.innerHTML += `<p><strong>Error:</strong> ${data.error}</p>`;
                    }
                })
                .catch(error => {
                    chatBody.innerHTML += `<p><strong>Error:</strong> An error occurred while fetching the response.</p>`;
                    console.error('请求出错:', error);
                });
        }

        // 处理发送消息按钮的点击事件
        document.getElementById('submit-message').addEventListener('click', () => {
            const userMessage = userMessageInput.value.trim();
            const modelPattern = modelPatternInput.value.trim();

            if (!userMessage) {
                alert('Please enter a message.');
                return;
            }

            // 获取已有的历史记录
            let chatHistory = JSON.parse(localStorage.getItem('chatHistory')) || [];

            // 将用户消息添加到历史记录
            chatHistory.push({ sender: userNameInput.value, message: userMessage });

            // 附加用户消息到聊天区域
            chatBody.innerHTML += `
                <div class="chat-message">
                    <img src="images/6.png" alt="Avatar" class="avatar-img" style="width: 150px; height: 150px;">
                    <p><strong>${userNameInput.value}【<span class="timer">${getCurrentTime()}</span>】:</strong> ${userMessage}</p>
                </div>
            `;

            // 发送请求到后端
            const currentFile = jsonFiles[currentJsonIndex];
            sendRequestToBackend(userMessage, chatHistory, modelPattern, currentFile);

            // 清空消息输入框
            userMessageInput.value = '';


        });

        // 清除消息历史记录
        document.getElementById('clear-mer-btn').addEventListener('click', () => {
            localStorage.removeItem('chatHistory');
            chatBody.innerHTML = ''; // 清空聊天界面
        });



        // 绑定背景切换按钮事件
        leftButton.addEventListener('click', () => {
            switchBackground('left');
            loadJsonFile();
        });
        rightButton.addEventListener('click', () => {
            switchBackground('right');
            loadJsonFile();
        });

        // 页面加载时发送初始请求
        window.addEventListener('load', () => {
            console.log('页面加载完成，发送初始请求...');
            const currentFile = jsonFiles[currentJsonIndex];
            sendRequestToBackend('加载 JSON 文件', [], '示例模型模式', currentFile);
        });
         // 保存聊天记录为 PDF
    savePdfBtn.addEventListener('click', () => {
        const {jsPDF} = window.jspdf;

        // 使用 html2canvas 获取聊天记录的截图
        html2canvas(chatBody).then(canvas => {
            const pdf = new jsPDF('p', 'mm', 'a4');

            // 获取 PDF 的宽度和高度
            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pdfHeight = pdf.internal.pageSize.getHeight();

            // 计算图片的高度，根据宽度进行等比例缩放
            const imgWidth = pdfWidth;
            const imgHeight = (canvas.height * imgWidth) / canvas.width;

            let position = 0;
            while (position < imgHeight) {
                const imgData = canvas.toDataURL('image/png');
                if (position + pdfHeight > imgHeight) {
                    // 如果剩余内容不足一页，裁剪最后一页的内容
                    pdf.addImage(imgData, 'PNG', 0, -position, imgWidth, imgHeight);
                } else {
                    // 正常添加一页内容
                    pdf.addImage(imgData, 'PNG', 0, -position, imgWidth, pdfHeight);
                }
                if (position + pdfHeight < imgHeight) {
                    // 如果还有剩余内容，添加新的页面
                    pdf.addPage();
                }
                position += pdfHeight;
            }

            // 保存 PDF 文件
            pdf.save('chat-history.pdf');
        }).catch(error => {
            console.error('Error generating PDF:', error);
        });
    });
        });



    </script>
    </body>
    </html>
