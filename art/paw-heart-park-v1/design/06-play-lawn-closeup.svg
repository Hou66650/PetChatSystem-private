<text x="720" y="895" font-family="sans-serif" font-size="14" fill="#718072">球从收纳区取出；追逐弧不穿过后勤与休息区</text><rect x="1040" y="810" width="820" height="260" rx="18" fill="#fffdf7" filter="url(#shadow)"/><text x="1070" y="850" font-family="sans-serif" font-size="18" font-weight="700" fill="#527f77">设计约束</text>
<text x="1070" y="885" font-family="sans-serif" font-size="14" fill="#718072">• 低矮石边标识范围，不阻碍跨出和紧急退出。</text>
<text x="1070" y="915" font-family="sans-serif" font-size="14" fill="#718072">• 排水槽放在外侧低处，不在奔跑落点上。</text>
<text x="1070" y="945" font-family="sans-serif" font-size="14" fill="#718072">• 彩球有固定收纳，不滚入饮水区。</text>
<text x="1070" y="975" font-family="sans-serif" font-size="14" fill="#718072">• 爪印只做方向提示，不缩小中央草坪。</text>
