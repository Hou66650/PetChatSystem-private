<text x="60" y="88" font-family="sans-serif" font-size="38" font-weight="700" fill="#3e5147">互动草坪：有边界，也有自由</text>
<text x="60" y="122" font-family="sans-serif" font-size="17" fill="#718072">追逐空间、排水与收纳同时成立，可爱装饰不占跑道</text><rect x="60" y="150" width="960" height="630" rx="18" fill="#fffdf7" filter="url(#shadow)"/><text x="90" y="190" font-family="sans-serif" font-size="18" font-weight="700" fill="#527f77">互动草坪近景 / 追逐、收纳与排水</text>
