<text x="1070" y="885" font-family="sans-serif" font-size="14" fill="#718072">• 外壳厚度、独立支撑与防滑地面明确。</text>
<text x="1070" y="915" font-family="sans-serif" font-size="14" fill="#718072">• 出入口不被耳形装饰或植被遮挡。</text>
<text x="1070" y="945" font-family="sans-serif" font-size="14" fill="#718072">• 圆润洞口只在上沿做少量耳形轮廓。</text>
<text x="1070" y="975" font-family="sans-serif" font-size="14" fill="#718072">• 两端均可退出，后宠能看见前宠位置。</text>
