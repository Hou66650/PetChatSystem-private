<text x="1070" y="945" font-family="sans-serif" font-size="14" fill="#718072">• 爪印仅在铺装，入口净宽与退后空间不变。</text>
<text x="1070" y="975" font-family="sans-serif" font-size="14" fill="#718072">• 入口同时看到草坪、休息区和隧道出口。</text>
