<text x="700" y="900" font-family="sans-serif" font-size="14" fill="#718072">可饮水、可独处，也可并肩休息；不必穿越草坪</text><rect x="1040" y="810" width="820" height="260" rx="18" fill="#fffdf7" filter="url(#shadow)"/><text x="1070" y="850" font-family="sans-serif" font-size="18" font-weight="700" fill="#527f77">真实感与可爱细节</text>
<text x="1070" y="885" font-family="sans-serif" font-size="14" fill="#718072">• 花苞顶棚提供真实遮阴，不遮挡邻近视线。</text>
<text x="1070" y="915" font-family="sans-serif" font-size="14" fill="#718072">• 水碗有抬高支架、托盘与外侧溢水路径。</text>
<text x="1070" y="945" font-family="sans-serif" font-size="14" fill="#718072">• 座椅和碗架离开追逐弧与设施出口。</text>
<text x="1070" y="975" font-family="sans-serif" font-size="14" fill="#718072">• 安静区可从入口直接看到，方便退出。</text>
