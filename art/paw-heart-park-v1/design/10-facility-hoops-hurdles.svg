<text x="1070" y="885" font-family="sans-serif" font-size="14" fill="#718072">• 支架有宽底座和圆角插接，跳落时不倒伏。</text>
<text x="1070" y="915" font-family="sans-serif" font-size="14" fill="#718072">• 高低两种尺度，幼宠与大狗都有绕行选择。</text>
<text x="1070" y="945" font-family="sans-serif" font-size="14" fill="#718072">• 花瓣与云朵仅作边框，不缩小跳跃净空。</text>
<text x="1070" y="975" font-family="sans-serif" font-size="14" fill="#718072">• 入口、落点和后宠等待区互不重叠。</text>
