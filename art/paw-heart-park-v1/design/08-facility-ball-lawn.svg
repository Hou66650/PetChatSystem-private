<text x="60" y="88" font-family="sans-serif" font-size="38" font-weight="700" fill="#3e5147">玩球草坪：边界、排水与追逐空间</text>
<text x="60" y="122" font-family="sans-serif" font-size="17" fill="#718072">不是一块纯色圆毯，而是可玩、可收纳、可退出的活动场</text><rect x="60" y="150" width="960" height="630" rx="18" fill="#fffdf7" filter="url(#shadow)"/><text x="90" y="190" font-family="sans-serif" font-size="18" font-weight="700" fill="#527f77">设施 01 / 玩球草坪</text>
