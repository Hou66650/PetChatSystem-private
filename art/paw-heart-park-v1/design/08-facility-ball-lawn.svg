<path d="M-13 9v18M0 10v18M12 9v18M22 5v20" stroke="#a9a9a0" stroke-width="5" stroke-linecap="round"/></g><rect x="1040" y="810" width="820" height="260" rx="18" fill="#fffdf7" filter="url(#shadow)"/><text x="1070" y="850" font-family="sans-serif" font-size="18" font-weight="700" fill="#527f77">真实感与可爱细节</text>
<text x="1070" y="885" font-family="sans-serif" font-size="14" fill="#718072">• 有边界、排水与固定收纳位置。</text>
<text x="1070" y="915" font-family="sans-serif" font-size="14" fill="#718072">• 中央只保留可穿行的追逐空间。</text>
<text x="1070" y="945" font-family="sans-serif" font-size="14" fill="#718072">• 爪印指路，彩球用柔色哑光材质。</text>
<text x="1070" y="975" font-family="sans-serif" font-size="14" fill="#718072">• 装饰不进入落球点与宠物急停区。</text>
