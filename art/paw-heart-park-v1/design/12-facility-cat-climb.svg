<text x="620" y="890" font-family="sans-serif" font-size="14" fill="#718072">可爬、可躲、可从另一侧下来；不会被看见即困住</text><rect x="1040" y="810" width="820" height="260" rx="18" fill="#fffdf7" filter="url(#shadow)"/><text x="1070" y="850" font-family="sans-serif" font-size="18" font-weight="700" fill="#527f77">真实感与可爱细节</text>
<text x="1070" y="885" font-family="sans-serif" font-size="14" fill="#718072">• 分层平台、抓挠柱与树洞都有真实厚度。</text>
<text x="1070" y="915" font-family="sans-serif" font-size="14" fill="#718072">• 上下与进出路线至少两条，避免单点拥堵。</text>
<text x="1070" y="945" font-family="sans-serif" font-size="14" fill="#718072">• 叶片只做平台轮廓，树洞不做夸张猫脸。</text>
<text x="1070" y="975" font-family="sans-serif" font-size="14" fill="#718072">• 跳点和藏身处不遮挡主通道与其他宠物。</text>
