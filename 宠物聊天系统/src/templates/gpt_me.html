        .gradient-button {
            position: relative;
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            border: none;
            border-radius: 50%; /* 圆形按钮 */
            width: 180px;
            height: 180px;
            cursor: pointer;
            background: radial-gradient(
                circle,
                rgba(75, 0, 130, 1) 0%, /* 深紫色 */
                rgba(138, 43, 226, 0.8) 40%, /* 中间紫色 */
                rgba(221, 160, 221, 0.6) 70%, /* 浅紫色 */
                rgba(255, 255, 255, 0.2) 100% /* 最浅色 */
            ); /* 渐变背景 */
            box-shadow: 0 4px 15px rgba(75, 0, 130, 0.5); /* 按钮阴影 */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* 鼠标悬停效果 */
        .gradient-button:hover {
            transform: scale(1.2); /* 放大效果 */
            box-shadow: 0 6px 25px rgba(138, 43, 226, 0.7); /* 增强阴影 */
        }

        /* 小圆点效果 */
        .gradient-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%; /* 初始宽度 */
            height: 100%; /* 初始高度 */
            border-radius: 50%; /* 圆形 */
            background: radial-gradient(
                circle,
                rgba(255, 255, 255, 0.6) 0%, /* 中心白色 */
                rgba(138, 43, 226, 0.3) 80%, /* 紫色渐变 */
                transparent 100% /* 透明边缘 */
            ); /* 小圆点的背景渐变 */
            animation: pulse 2s infinite; /* 动态脉冲效果 */
        }

        /* 动态脉冲动画 */
        @keyframes pulse {
            0% {
                transform: translate(-50%, -50%) scale(1); /* 初始大小 */
                opacity: 1; /* 完全可见 */
            }
            100% {
                transform: translate(-50%, -50%) scale(1.5); /* 放大 */
                opacity: 0; /* 渐隐 */
            }
        }

 <script>
// 获取当前时间并格式化
function getCurrentTime() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const seconds = String(now.getSeconds()).padStart(2, '0');
    return `${hours}:${minutes}:${seconds}`;
}
function goBack() {
            window.location.href = "/reader"; // 返回入口页面
        }
function remark_pet() {
            window.location.href = "/remark_pet"; // 返回入口页面
        }
 function enterDiary() {
            window.location.href = "/diary"; // 跳转到日记本页面
        }
// 在 DOM 加载完成后执行
document.addEventListener('DOMContentLoaded', () => {
    // 获取 DOM 元素
    const timeDisplay = document.getElementById('timer');
    const chatBody = document.getElementById('chat-body');
    const userMessageInput = document.getElementById('user-message');
    const modelPatternInput = document.getElementById('model-pattern');
    const userNameInput = document.getElementById('user-name');
    const assistantNameInput = document.getElementById('assistant-name');
    const leftButton = document.querySelector('.left-button');
    const rightButton = document.querySelector('.right-button');
    const savePdfBtn = document.getElementById('save-pdf-btn');
    const avatarImg = document.getElementById('ai-avatar'); // 当前 AI 头像
    const uploadInput = document.getElementById('upload-avatar'); // 上传文件输入框
     // 添加上传状态变量
    let uploadStatus = 'idle'; // 初始状态为空闲

    // 背景图片与 JSON 文件列表
    const backgroundImages = ['css/b.jpg', 'css/c.jpg', 'css/d.jpg', 'css/a.jpg'];
    const jsonFiles = [
        'templates/json/role_description1.json',
        'templates/json/role_description2.json',
        'templates/json/role_description3.json',
        'templates/json/role_description4.json'
    ];
    let currentImageIndex = -1;
    let currentJsonIndex = -1;

    // 定义 AI 头像映射表
    const avatarMapping = {
        Corgi: 'images/f.png', // 柯基
        Samoyed: 'images/d.png', // 萨摩耶
        Shepherd: 'images/b.png', // 德牧
        default: 'images/c.png', // 默认头像
        self_image:'images/processed-avatar.png'
    };

    // 更新当前时间显示
    function updateCurrentTime() {
        if (timeDisplay) {
            timeDisplay.textContent = getCurrentTime();
        }
    }

    setInterval(updateCurrentTime, 60000);
    updateCurrentTime();

    // 切换背景图片和 JSON 文件
    function switchBackground(direction) {
        if (direction === 'left') {
            currentImageIndex = (currentImageIndex - 1 + backgroundImages.length) % backgroundImages.length;
            currentJsonIndex = (currentJsonIndex - 1 + jsonFiles.length) % jsonFiles.length;
        } else {
            currentImageIndex = (currentImageIndex + 1) % backgroundImages.length;
            currentJsonIndex = (currentJsonIndex + 1) % jsonFiles.length;
        }

        // 更新背景图片
        document.body.style.backgroundImage = `url('${backgroundImages[currentImageIndex]}')`;
    }

    // 上传头像功能
    uploadInput.addEventListener('change', async (event) => {
        const file = event.target.files[0];
        console.log(file)
        if (!file) {
            alert('请选择图片文件！');
            return;
        }

        // 构造表单数据
        const formData = new FormData();
        formData.append('image', file);
        console.log(formData.name)

        try {
            // 发送图片到后端进行处理
            const response = await fetch('/upload-avatar', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (data.success && data.image_url) {
                // 更新前端头像
                avatarImg.src = data.image_url;
                console.log(avatarImg.src);
                alert('头像更新成功！');
                uploadStatus = 'success'
            } else {
                alert('头像更新失败，请重试！');
            }
        } catch (error) {
            console.error('上传失败:', error);
            alert('上传失败，请检查网络连接！');
        }
    });

    // 获取按钮元素
    const changeStatusButton = document.getElementById('changeStatusButton');

    // 为按钮添加点击事件监听器
    changeStatusButton.addEventListener('click', function () {
        uploadStatus = 'idle';
        console.log(`uploadStatus 已改为: ${uploadStatus}`);
    });

    // 发送消息并获取 AI 回复
    document.getElementById('submit-message').addEventListener('click', async function () {
        const userMessage = userMessageInput.value.trim();
        const modelPattern = modelPatternInput.value;
        const userName = userNameInput.value.trim();
        const assistantName = assistantNameInput.value.trim();

        if (!userMessage) {
            alert('请输入消息内容。');
            return;
        }

        // 获取当前 JSON 文件路径
        const currentJsonFile = jsonFiles[currentJsonIndex];

        // 更新聊天记录
        let chatHistory = JSON.parse(localStorage.getItem('chatHistory')) || [];
        chatHistory.push({ sender: userName || '用户', message: userMessage });

        // 显示用户消息
        const userMessageDiv = document.createElement('div');
        userMessageDiv.className = 'user-message';
        userMessageDiv.innerHTML = `
            <img src="images/头像2原图.png" alt="Avatar" class="avatar-img">
            <p><strong>${userName || '用户'}<span class="timer">${getCurrentTime()}</span>:</strong> ${userMessage}</p>
        `;
        chatBody.appendChild(userMessageDiv);

        try {
            // 向后端发送 POST 请求
            const response = await fetch('/get_gpt_response', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: userMessage,
                    chatHistory: chatHistory,
                    model_pattern: modelPattern,
                    jsonFile: currentJsonFile // 将当前 JSON 文件路径发送给后端
                })
            });

            const data = await response.json();

            if (data.reply) {
                // 更新聊天记录
                chatHistory.push({ sender: assistantName || 'AI', message: data.reply });
                localStorage.setItem('chatHistory', JSON.stringify(chatHistory));
                console.log(chatHistory)
                console.log(typeof chatHistory)

                // 根据后端返回的 role 值动态设置 AI 的头像
                if (uploadStatus === 'success'){
                    const role = 'self_image';
                    const avatarSrc = avatarMapping[role] || avatarMapping.default;
                    // 显示 AI 的回复
                const assistantMessageDiv = document.createElement('div');
                assistantMessageDiv.className = 'assistant-message';
                assistantMessageDiv.innerHTML = `
                    <img src="${avatarSrc}" id="chat_tx" alt="Avatar" class="avatar-img">
                    <p><strong>${role||assistantName || 'AI'}<span class="timer">${getCurrentTime()}</span>:</strong> ${data.reply}</p>
                `;
                chatBody.appendChild(assistantMessageDiv);


                }
                else{
                    const role = data.role || 'default'; // 后端返回的角色信息
                const avatarSrc = avatarMapping[role] || avatarMapping.default;

                // 显示 AI 的回复
                const assistantMessageDiv = document.createElement('div');
                assistantMessageDiv.className = 'assistant-message';
                assistantMessageDiv.innerHTML = `
                    <img src="${avatarSrc}" id="chat_tx" alt="Avatar" class="avatar-img">
                    <p><strong>${role||assistantName || 'AI'}<span class="timer">${getCurrentTime()}</span>:</strong> ${data.reply}</p>
                `;
                chatBody.appendChild(assistantMessageDiv);
                }

            } else if (data.error) {
                const errorDiv = document.createElement('p');
                errorDiv.innerHTML = `<strong>Error:</strong> ${data.error}`;
                chatBody.appendChild(errorDiv);
            }
        } catch (error) {
            const errorDiv = document.createElement('p');
            errorDiv.innerHTML = `<strong>Error:</strong> 请求失败，请稍后重试。`;
            chatBody.appendChild(errorDiv);
        }

        // 清空用户输入框
        userMessageInput.value = '';
    });

    // 清空聊天记录
    document.getElementById('clear-mer-btn').addEventListener('click', function () {
        localStorage.removeItem('chatHistory');
        chatBody.innerHTML = '';
    });

    // 左右切换按钮事件
    leftButton.addEventListener('click', () => {
        switchBackground('left');
    });

    rightButton.addEventListener('click', () => {
        switchBackground('right');
    });

    // 保存聊天记录为 PDF
    savePdfBtn.addEventListener('click', () => {
        const { jsPDF } = window.jspdf;
        html2canvas(chatBody).then(canvas => {
            const pdf = new jsPDF('p', 'mm', 'a4');
            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pdfHeight = pdf.internal.pageSize.getHeight();
            const imgWidth = pdfWidth;
            const imgHeight = (canvas.height * imgWidth) / canvas.width;

            let y = 0;
            while (y < canvas.height) {
                const pageCanvas = document.createElement('canvas');
                pageCanvas.width = canvas.width;
                pageCanvas.height = Math.min(canvas.height - y, pdfHeight * canvas.width / pdfWidth);
                const ctx = pageCanvas.getContext('2d');
                ctx.drawImage(canvas, 0, y, canvas.width, pageCanvas.height, 0, 0, pageCanvas.width, pageCanvas.height);
                pdf.addImage(pageCanvas.toDataURL('image/png'), 'PNG', 0, 0, imgWidth, imgHeight);
                y += pageCanvas.height;
                if (y < canvas.height) pdf.addPage();
            }

            pdf.save('chat-history.pdf');
        }).catch(error => {
            console.error('Error generating PDF:', error);
        });
    });

    // 页面加载时自动切换到右边的背景
    window.addEventListener('load', () => {
        switchBackground('right');
    });
});

</script>
