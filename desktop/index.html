<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; media-src blob:"><link rel="stylesheet" href="../static/css/glass-loading.css"><script src="../static/js/glass-loading.js"></script><title>派特岛桌面门</title><style>body{background:#eff5ed;color:#304e41;font:15px/1.8 system-ui;padding:24px}input{display:block;box-sizing:border-box;width:100%;padding:10px;margin:8px 0;border:1px solid #bdcfb6;border-radius:10px}button{padding:10px 16px;border-radius:12px;border:1px solid #adc4a5;background:#fff7dc;color:#47523d;margin:6px 0;cursor:pointer}small{display:block;color:#6a7f70}input[type=checkbox]{display:inline;width:auto}h1{font-size:24px}#status{min-height:50px}textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #bdcfb6;border-radius:10px;resize:vertical}#messages{max-height:230px;overflow-y:auto;white-space:pre-wrap;overflow-wrap:anywhere}#messages p{padding:10px;border-radius:12px;background:#fff9ed}#chat-error{color:#914d38}button:disabled{opacity:.5;cursor:default}.task-card{background:#fff9ed;padding:12px;margin:12px 0;border:1px solid #c6d2bc;border-radius:12px}.task-card p{margin:6px 0}.task-card button{margin-right:5px}select{padding:8px;max-width:100%}#task-error{color:#914d38}#task-list{max-height:500px;overflow:auto}.retry-confirm{border:1px solid #c69758;padding:8px}</style></head><body><small>PAIT ISLAND / DESKTOP COMPANION</small><h1>让它来桌面陪你</h1><form id="pair"><label>派特岛网站地址<input id="origin" value="http://127.0.0.1:5002" required></label><label>网页生成的一次性配对码<input id="code" required autocomplete="off"></label><button>连接桌面传送门</button></form><p id="status" role="status"></p><section id="connected" hidden><small id="deadline"></small><button id="return">🏝 返回悬浮岛</button><label><input type="checkbox" id="sense">开启软件感知（本次行程）</label><small>只感知应用类别和播放器进度控件位置。不读取文档、窗口标题或屏幕截图。关闭客户端会召回宠物。</small><section id="actions-panel"><h2>陪伴动作</h2><label><input type="checkbox" id="autonomous" checked>自主活动</label><small>它会自己嗅闻、伸懒腰、打招呼和休息。也可以选一个动作陪你玩。</small><form id="action-form"><label for="action-select">选择动作</label><select id="action-select"></select><button id="action-play">做这个动作</button></form><small id="action-status" role="status"></small></section><section id="chat-panel"><h2>聊聊今天</h2><small>沿用这只宠物的记忆与声音。目前支持聊天和朗读。</small><div id="messages" role="log" aria-live="polite"></div><form id="chat-form"><label for="message">想对它说什么</label><textarea id="message" rows="2" maxlength="2000" required></textarea><button id="send">发送</button><button id="stop-audio" type="button">停止朗读</button></form><small id="chat-error" role="status"></small></section></section><section id="tools-panel" hidden><h2>提醒与专注</h2><small id="tools-hint"></small><form id="tool-form"><label>类型 <select id="tool-kind"><option value="reminder.create">提醒</option><option value="focus_timer.start">专注计时</option></select></label><label>内容<input id="tool-title" value="喝水休息一下" maxlength="80" required></label><label>多久以后／专注多久<input id="tool-duration" type="number" min="1" max="1800" step="1" value="5" required></label><select id="tool-unit" aria-label="时长单位"><option value="60">分钟</option><option value="1">秒（至少 10 秒）</option></select><button id="tool-propose">生成审批卡</button></form><small>也可发送“5分钟后提醒我喝水”或“专注25分钟”；批准前不会执行。</small><p id="task-error" role="status"></p><div id="task-list" aria-live="polite"></div></section><script src="tasks.js"></script><script src="control.js"></script></body></html>
